name: Android dual overlay native ABI
on:
  workflow_dispatch:
  push:
    branches: ['codex/acceptance-android-dual-native/**']
permissions:
  contents: read
concurrency:
  group: android-dual-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install pinned cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'ndk;28.2.13676358'
          rustup toolchain install 1.95.0 1.96.0 --profile minimal
          rustup target add --toolchain 1.95.0 x86_64-linux-android
          rustup target add --toolchain 1.96.0 x86_64-linux-android
      - name: Run native verifier counterexamples
        run: python3 -m unittest discover -s validation/native/tool -p 'test_android*.py' -v
      - name: Build fixed-source TS, ET and independent JNI bridge
        id: native
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 validation/native/tool/android_bundle.py build "$RUNNER_TEMP/android-dual-native" --abi x86_64 --tailscale --bridge --release
      - name: Independently verify packaged ELF, exports, dependencies and hashes
        id: verify
        run: |
          python3 validation/native/tool/android_bundle.py verify "$RUNNER_TEMP/android-dual-native" \
            --abi x86_64 --commit "$GITHUB_SHA" \
            --readelf "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
      - name: Preserve exact validation scope
        if: always()
        env:
          BUILD_STATUS: ${{ steps.native.outcome }}
          VERIFY_STATUS: ${{ steps.verify.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'android-dual-native'
          output.mkdir(parents=True, exist_ok=True)
          result = {'sourceCommit': os.environ['GITHUB_SHA'], 'abi': 'x86_64', 'api': 35,
                    'build': os.environ['BUILD_STATUS'], 'staticVerification': os.environ['VERIFY_STATUS'],
                    'androidLoad': 'not run', 'installation': 'not run', 'node': 'not run',
                    'apk': 'not built', 'gui': 'not run'}
          path = output / 'manifest.json'
          if path.is_file():
              result['nativeManifestSha256'] = hashlib.sha256(path.read_bytes()).hexdigest()
          (output / 'native-summary.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-dual-native-x86_64-${{ github.sha }}
          path: ${{ runner.temp }}/android-dual-native
          # The verified source material includes portable-stream/.gitignore.
          # This is only the self-created native output directory, never HOME.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  download-replay:
    needs: native-x86
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-dual-native-x86_64-${{ github.sha }}
          path: ${{ runner.temp }}/downloaded-native
      - name: Replay full verification against downloaded bytes
        id: replay
        run: |
          python3 validation/native/tool/android_bundle.py verify "$RUNNER_TEMP/downloaded-native" \
            --abi x86_64 --commit "$GITHUB_SHA" --readelf "$(command -v readelf)"
      - name: Record distribution result separately from compilation
        if: always()
        env:
          REPLAY_STATUS: ${{ steps.replay.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          path = root / 'downloaded-native/manifest.json'
          result = {'sourceCommit': os.environ['GITHUB_SHA'], 'abi': 'x86_64',
                    'downloadedBundleVerification': os.environ['REPLAY_STATUS'],
                    'androidLoad': 'not run', 'node': 'not run'}
          if path.is_file():
              result['nativeManifestSha256'] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'download-replay.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-dual-native-download-replay-${{ github.sha }}
          path: ${{ runner.temp }}/download-replay.json
          if-no-files-found: error
          retention-days: 14
