name: Android dual overlay transport preflight
on:
  push:
    branches: ['codex/acceptance/android-dual-overlay-transport']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-avd-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - name: Check scoped mapping guards
        run: |
          python3 -m unittest discover -s validation/remote-harness -p 'test_android_dual_overlay_reverse.py' -v
          python3 -m unittest discover -s validation/remote-harness -p 'test_android_dual_overlay_relay.py' -v
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends acl libpulse0 iproute2
      - name: Exercise owned API35 shell transport
        shell: bash
        run: |
          set -euo pipefail
          namespace="hp-dual-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            failed=0
            if sudo ip netns list | awk '{print $1}' | grep -Fxq "$namespace"; then
              pids=$(sudo ip netns pids "$namespace")
              if [ -n "$pids" ]; then
                failed=1
                if [[ "$pids" =~ ^[[:space:]0-9]+$ ]]; then
                  sudo kill -TERM $pids || true
                  for attempt in 1 2 3 4 5; do pids=$(sudo ip netns pids "$namespace"); [ -z "$pids" ] && break; sleep 1; done
                  if [ -n "$pids" ]; then sudo kill -KILL $pids || true; fi
                fi
              fi
              sudo ip netns delete "$namespace" || failed=1
            fi
            return "$failed"
          }
          trap cleanup EXIT
          sudo ip netns add "$namespace"
          sudo ip netns exec "$namespace" ip link set lo up
          status=0
          AVD_EVIDENCE_DIR="$RUNNER_TEMP/dual-overlay-avd" bash validation/remote-harness/with-android-emulator.sh \
            python3 validation/remote-harness/android_dual_overlay_transport.py --output "$RUNNER_TEMP/dual-overlay-transport" || status=$?
          cleanup || status=1
          trap - EXIT
          python3 - "$RUNNER_TEMP/dual-overlay-transport/result.json" "$namespace" "$status" <<'PY'
          import json, os, pathlib, subprocess, sys
          path=pathlib.Path(sys.argv[1]);path.parent.mkdir(parents=True,exist_ok=True)
          result=json.loads(path.read_text()) if path.exists() else {'schemaVersion':1,'status':'failed','errorCode':'owned_avd_or_preflight_failed'}
          result['sourceSHA']=os.environ['GITHUB_SHA']
          result['namespaceRemoved']=sys.argv[2] not in [line.split()[0] for line in subprocess.check_output(['ip','netns','list'],text=True).splitlines() if line.split()]
          result['avdWrapperSucceeded']=int(sys.argv[3]) == 0
          if not result['namespaceRemoved'] or not result['avdWrapperSucceeded']: result['status']='failed'
          path.write_text(json.dumps(result,indent=2)+'\n')
          PY
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-dual-overlay-transport-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dual-overlay-transport/result.json
            ${{ runner.temp }}/dual-overlay-avd/lifecycle.txt
          if-no-files-found: warn
          retention-days: 14
