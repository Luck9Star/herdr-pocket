name: Android network candidate batch (arm64)
on:
  push:
    branches: ['codex/network-batch/**']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: network-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android-pairing:
    if: startsWith(github.ref, 'refs/heads/codex/network-batch/with-emulators-')
    uses: ./.github/workflows/paired-android-emulator.yml
  transport-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Verify the fixed source repair and test isolated SSH controls
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          python3 validation/vendor/verify-russh.py
          cargo test --manifest-path validation/transport-rust/Cargo.toml --locked --features overlay-native-fixture,overlay-tailscale-fixture 2>&1 | tee "$RUNNER_TEMP/transport-tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-network-transport-source-${{ github.sha }}
          path: ${{ runner.temp }}/transport-tests.log
          if-no-files-found: ignore
          retention-days: 14
  flutter-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      verified_lock: ${{ steps.resolve.outputs.verified_lock }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Prepare the pinned experimental renderer and shared mobile fixtures
        run: |
          python3 -m unittest discover -s validation/flutter/tool -v
          python3 validation/flutter/tool/ci.py bootstrap --destination "$RUNNER_TEMP/flutter-sdk"
          export PATH="$RUNNER_TEMP/flutter-sdk/bin:$PATH"
          python3 validation/flutter/tool/ci.py prepare --destination "$RUNNER_TEMP/flutter-probe"
          python3 validation/flutter/tool/candidate.py apply --destination "$RUNNER_TEMP/flutter-probe"
      - name: Resolve and verify the candidate lock
        id: resolve
        working-directory: ${{ runner.temp }}/flutter-probe
        run: |
          flutter pub get
          python3 "$GITHUB_WORKSPACE/validation/flutter/tool/candidate.py" verify-lock --destination "$RUNNER_TEMP/flutter-probe"
          echo "verified_lock=true" >> "$GITHUB_OUTPUT"
      - name: Analyze candidate
        working-directory: ${{ runner.temp }}/flutter-probe
        run: flutter analyze 2>&1 | tee candidate-analyze.log
      - name: Test mobile state and input contracts
        id: safety
        if: "!cancelled() && steps.resolve.outputs.verified_lock == 'true'"
        working-directory: ${{ runner.temp }}/flutter-probe
        run: flutter test --reporter expanded 2>&1 | tee candidate-safety-tests.log
      - name: Test the combining-character repair
        id: renderer
        if: "!cancelled() && steps.resolve.outputs.verified_lock == 'true'"
        working-directory: ${{ runner.temp }}/flutter-probe
        run: flutter test diagnostic/combining_render_test.dart regression/combining_patch_test.dart --reporter expanded 2>&1 | tee candidate-render-tests.log
      - name: Test pairing and retained SSH observation with an isolated host
        if: "!cancelled() && steps.safety.outcome == 'success' && steps.renderer.outcome == 'success'"
        run: |
          export PATH="$RUNNER_TEMP/flutter-sdk/bin:$PATH"
          python3 -m venv "$RUNNER_TEMP/pairing-venv"
          "$RUNNER_TEMP/pairing-venv/bin/pip" install -r validation/pairing/requirements.txt
          PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/pairing-venv/bin/python" -m unittest discover -s validation/remote-harness -q
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y openssh-server
          "$RUNNER_TEMP/pairing-venv/bin/python" validation/remote-harness/run-ci.py --paired-gui flutter --flutter-app "$RUNNER_TEMP/flutter-probe" --output "$RUNNER_TEMP/paired-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-network-flutter-ssh-${{ github.sha }}
          path: ${{ runner.temp }}/paired-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-network-flutter-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/flutter-probe/pubspec.lock
            ${{ runner.temp }}/flutter-probe/candidate-manifest.json
            ${{ runner.temp }}/flutter-probe/candidate-*.log
            ${{ runner.temp }}/flutter-probe/probe-results
          if-no-files-found: ignore
          retention-days: 14
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - name: Install pinned Android and Rust toolchains
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'ndk;28.2.13676358'
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 aarch64-linux-android
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build and statically inspect candidate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 validation/native/tool/android_bundle.py build "$RUNNER_TEMP/android-native" --tailscale
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-native-${{ github.sha }}
          path: ${{ runner.temp }}/android-native
          # Generated source bundle only; preserve the manifest's .gitignore.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: android-native-failure-${{ github.sha }}
          path: ${{ runner.temp }}/android-native
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
  apps:
    needs: [native, flutter-source, transport-source]
    if: "!cancelled() && needs.native.result == 'success'"
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        app: [flutter, tauri]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-native-${{ github.sha }}
          path: ${{ runner.temp }}/android-native
      - name: Install toolchain and verify native input
        run: |
          python3 validation/vendor/verify-russh.py
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add aarch64-linux-android
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "HEELER_ET_LIB_DIR=$RUNNER_TEMP/android-native" >> "$GITHUB_ENV"
          echo "HP_TS_LIB_DIR=$RUNNER_TEMP/android-native" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
          echo "READELF=$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 validation/native/tool/android_bundle.py verify "$RUNNER_TEMP/android-native" --commit "$GITHUB_SHA" --readelf "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.app == 'tauri'
        with:
          node-version: '22.22.2'
      - name: Build Tauri arm64 APK
        if: matrix.app == 'tauri'
        working-directory: validation/tauri
        run: |
          npm ci
          npm test
          npm run tauri -- icon icon.svg
          npm run tauri -- android init --ci
          python3 scripts/wire-android.py
          mkdir -p src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
          cp "$HEELER_ET_LIB_DIR/libheeler_easytier.so" "$HP_TS_LIB_DIR/libhp_tailscale.so" src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/
          npm run tauri -- android build --debug --target aarch64 --features network-easytier,network-tailscale --apk --ci
          mapfile -t apks < <(find src-tauri/gen/android -name '*.apk' -type f)
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" "$RUNNER_TEMP/app.apk"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.app == 'flutter'
        with:
          name: android-network-flutter-source-${{ github.sha }}
          path: ${{ runner.temp }}/flutter-source
      - name: Build Flutter arm64 APK from the verified experimental candidate
        if: matrix.app == 'flutter'
        env:
          VERIFIED_LOCK: ${{ needs.flutter-source.outputs.verified_lock }}
        run: |
          test "$VERIFIED_LOCK" = true
          python3 validation/flutter/tool/ci.py bootstrap --destination "$RUNNER_TEMP/flutter-sdk"
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/flutter-sdk/bin:$PATH"
          python3 validation/flutter/tool/ci.py prepare --destination "$RUNNER_TEMP/flutter-probe"
          python3 validation/flutter/tool/candidate.py apply --destination "$RUNNER_TEMP/flutter-probe"
          cp "$RUNNER_TEMP/flutter-source/pubspec.lock" "$RUNNER_TEMP/flutter-probe/pubspec.lock"
          cargo build --manifest-path validation/flutter-network-runtime/Cargo.toml --locked --target aarch64-linux-android --features network-easytier,network-tailscale
          mkdir -p "$RUNNER_TEMP/flutter-probe/android/app/src/main/jniLibs/arm64-v8a"
          cp "$HEELER_ET_LIB_DIR/libheeler_easytier.so" "$HP_TS_LIB_DIR/libhp_tailscale.so" "$RUNNER_TEMP/flutter-probe/android/app/src/main/jniLibs/arm64-v8a/"
          cp validation/flutter-network-runtime/target/aarch64-linux-android/debug/libherdr_flutter_network_runtime.so "$RUNNER_TEMP/flutter-probe/android/app/src/main/jniLibs/arm64-v8a/"
          cd "$RUNNER_TEMP/flutter-probe"
          flutter pub get --enforce-lockfile
          python3 "$GITHUB_WORKSPACE/validation/flutter/tool/candidate.py" verify-lock --destination "$RUNNER_TEMP/flutter-probe"
          flutter build apk --debug --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/app.apk"
      - name: Verify APK ABI, native hash and dynamic dependency
        run: python3 validation/native/tool/android_bundle.py apk "$RUNNER_TEMP/app.apk" "$RUNNER_TEMP/android-native" --commit "$GITHUB_SHA" --readelf "$READELF" --app '${{ matrix.app }}'
      - name: Record APK provenance and validation boundary
        env:
          APP: ${{ matrix.app }}
          SOURCE_CHECKS: ${{ matrix.app == 'flutter' && needs.flutter-source.result || 'success' }}
          TRANSPORT_CHECKS: ${{ needs.transport-source.result }}
        run: |
          mkdir -p "$RUNNER_TEMP/app-output"
          cp "$RUNNER_TEMP/app.apk" "$RUNNER_TEMP/app-output/app.apk"
          cp "$RUNNER_TEMP/android-native/manifest.json" "$RUNNER_TEMP/app-output/native-manifest.json"
          if test "$APP" = flutter; then
            cp "$RUNNER_TEMP/flutter-probe/candidate-manifest.json" "$RUNNER_TEMP/app-output/candidate-manifest.json"
            cp "$RUNNER_TEMP/flutter-probe/candidate/terminal_view/LICENSE" "$RUNNER_TEMP/app-output/terminal_view-LICENSE"
            cp "$RUNNER_TEMP/flutter-probe/candidate/terminal_view/NOTICE" "$RUNNER_TEMP/app-output/terminal_view-NOTICE"
          fi
          cp validation/shared/mobile-tabs-v1.json "$RUNNER_TEMP/app-output/mobile-tabs-v1.json"
          cp validation/shared/session-watch-v1.json "$RUNNER_TEMP/app-output/session-watch-v1.json"
          cp validation/shared/tailscale-settings-v1.json "$RUNNER_TEMP/app-output/tailscale-settings-v1.json"
          cp validation/shared/target-input-journal-v1.json "$RUNNER_TEMP/app-output/target-input-journal-v1.json"
          cp validation/vendor/RUSSH-NOTICE.md validation/vendor/russh-0.65.0-source.json validation/vendor/russh-0.65.0-local-close.patch "$RUNNER_TEMP/app-output/"
          cp validation/vendor/russh-0.65.0-LICENSE-APACHE "$RUNNER_TEMP/app-output/russh-LICENSE"
          python3 validation/native/tool/android_bundle.py report "$RUNNER_TEMP/app-output" --commit "$GITHUB_SHA" --app "$APP" --checks "$SOURCE_CHECKS" --transport-checks "$TRANSPORT_CHECKS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-${{ matrix.app }}-network-${{ github.sha }}
          path: ${{ runner.temp }}/app-output
          if-no-files-found: error
          retention-days: 14
