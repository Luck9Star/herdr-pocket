name: Android private CA Go TLS preflight
on:
  push:
    branches: ['codex/acceptance/android-private-ca-probe']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-avd-private-ca:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build disposable Go TLS instrumentation
        run: |
          python3 -m unittest discover -s validation/remote-harness -p 'test_android_dual_overlay_reverse.py' -v
          python3 -m unittest discover -s validation/remote-harness -p 'test_android_dual_overlay_relay.py' -v
          python3 -m unittest discover -s validation/remote-harness -p 'test_android_private_ca_probe.py' -v
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' >/dev/null
          bash validation/remote-harness/android-private-ca-probe/build.sh "$RUNNER_TEMP/hp-go-tls-probe.apk"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends acl libpulse0 iproute2
      - name: Exercise owned API35 process-private Go TLS
        shell: bash
        run: |
          set -euo pipefail
          namespace="hp-dual-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            failed=0
            if sudo ip netns list | awk '{print $1}' | grep -Fxq "$namespace"; then
              pids=$(sudo ip netns pids "$namespace")
              if [ -n "$pids" ]; then
                failed=1
                if [[ "$pids" =~ ^[[:space:]0-9]+$ ]]; then
                  sudo kill -TERM $pids || true
                  for attempt in 1 2 3 4 5; do pids=$(sudo ip netns pids "$namespace"); [ -z "$pids" ] && break; sleep 1; done
                  if [ -n "$pids" ]; then sudo kill -KILL $pids || true; fi
                fi
              fi
              sudo ip netns delete "$namespace" || failed=1
            fi
            return "$failed"
          }
          trap cleanup EXIT
          sudo ip netns add "$namespace"
          sudo ip netns exec "$namespace" ip link set lo up
          status=0
          AVD_EVIDENCE_DIR="$RUNNER_TEMP/private-ca-avd" bash validation/remote-harness/with-android-emulator.sh \
            python3 validation/remote-harness/android_private_ca_probe.py --apk "$RUNNER_TEMP/hp-go-tls-probe.apk" --output "$RUNNER_TEMP/private-ca-result" || status=$?
          cleanup || status=1
          trap - EXIT
          rm -f "$RUNNER_TEMP/hp-go-tls-probe.apk"
          python3 - "$RUNNER_TEMP/private-ca-result/result.json" "$namespace" "$status" <<'PY'
          import json, os, pathlib, subprocess, sys
          path=pathlib.Path(sys.argv[1]);path.parent.mkdir(parents=True,exist_ok=True)
          result=json.loads(path.read_text()) if path.exists() else {'schemaVersion':1,'status':'failed','errorCode':'owned_avd_or_tls_preflight_failed'}
          result['sourceSHA']=os.environ['GITHUB_SHA']
          result['apkRemoved']=not pathlib.Path(os.environ['RUNNER_TEMP'],'hp-go-tls-probe.apk').exists()
          result['namespaceRemoved']=sys.argv[2] not in [line.split()[0] for line in subprocess.check_output(['ip','netns','list'],text=True).splitlines() if line.split()]
          result['avdWrapperSucceeded']=int(sys.argv[3]) == 0
          if not result['namespaceRemoved'] or not result['avdWrapperSucceeded'] or not result['apkRemoved']: result['status']='failed'
          path.write_text(json.dumps(result,indent=2)+'\n')
          PY
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-private-ca-probe-${{ github.sha }}
          path: |
            ${{ runner.temp }}/private-ca-result/result.json
            ${{ runner.temp }}/private-ca-avd/lifecycle.txt
          if-no-files-found: warn
          retention-days: 14
