name: Android fixed product TS JNI start status probe
on:
  push:
    branches: ['codex/acceptance-android-ts-node/**']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        diagnostics: [optin, plain]
    env:
      NATIVE_SOURCE: 45ea7dc6f9b99b9bc2fba0f2e53f6e31c7a0ccbf
      HOST_SOURCE: 5404adfb3c86f5174edda38f1d0c63c8d81996c5
      PROBE_DIAGNOSTICS: ${{ matrix.diagnostics }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 45ea7dc6f9b99b9bc2fba0f2e53f6e31c7a0ccbf
          path: native-source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5404adfb3c86f5174edda38f1d0c63c8d81996c5
          path: host-source
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - name: Prepare isolated tools and guards
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends acl libpulse0 iproute2 openssh-server binutils
          python3 -m venv "$RUNNER_TEMP/probe-python"
          "$RUNNER_TEMP/probe-python/bin/pip" install -r validation/pairing/requirements.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          "$RUNNER_TEMP/probe-python/bin/python" -m unittest discover -s validation/remote-harness -p test_android_ts_node_probe.py -v
      - name: Download exact fixed normal QA and host binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14186229335/zip" > "$RUNNER_TEMP/normal.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14187025553/zip" > "$RUNNER_TEMP/qa.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14171011473/zip" > "$RUNNER_TEMP/host.zip"
          echo 'a550201da9e6bee263ba3127eb92d1850e97a18d72616fcef5149e76d9447ad1  '"$RUNNER_TEMP/normal.zip" | sha256sum -c -
          echo '3f49c8111b5f0996221a028c717632224436bc0c5b25edc99f768e038b54c81f  '"$RUNNER_TEMP/qa.zip" | sha256sum -c -
          echo '4bdc54843a9f438896db3717bd002859021fab51cbe60339c35e8a62a5bd6698  '"$RUNNER_TEMP/host.zip" | sha256sum -c -
          mkdir "$RUNNER_TEMP/normal" "$RUNNER_TEMP/qa" "$RUNNER_TEMP/host"
          unzip -q "$RUNNER_TEMP/normal.zip" -d "$RUNNER_TEMP/normal"
          unzip -q "$RUNNER_TEMP/qa.zip" -d "$RUNNER_TEMP/qa"
          unzip -q "$RUNNER_TEMP/host.zip" -d "$RUNNER_TEMP/host"
          python3 native-source/validation/native/tool/android_bundle.py verify "$RUNNER_TEMP/normal" --abi x86_64 --commit "$NATIVE_SOURCE" --readelf /usr/bin/readelf
          python3 native-source/validation/native/tool/android_dual_qa_bundle.py verify --normal "$RUNNER_TEMP/normal" --qa "$RUNNER_TEMP/qa" --commit "$NATIVE_SOURCE" --readelf /usr/bin/readelf
          python3 host-source/validation/remote-harness/dual_overlay_shared_bundle.py verify --bundle "$RUNNER_TEMP/host" --source-sha "$HOST_SOURCE" --restore-executable
      - name: Build two small APKs with the unchanged product native libraries
        run: |
          mkdir "$RUNNER_TEMP/probe-apks"
          for variant in normal qa; do
            bash validation/remote-harness/android-ts-node-probe/build.sh "$RUNNER_TEMP/$variant" "$GITHUB_WORKSPACE/native-source" "$RUNNER_TEMP/probe-apks/$variant.apk"
          done
      - name: Exercise real API35 KeyStore product JNI and explicit node lifecycle
        id: device
        run: |
          mkdir -p "$RUNNER_TEMP/probe-work"
          AVD_EVIDENCE_DIR="$RUNNER_TEMP/probe-avd" bash validation/remote-harness/with-android-emulator.sh \
            "$RUNNER_TEMP/probe-python/bin/python" validation/remote-harness/android_ts_node_probe.py \
              --bundle "$RUNNER_TEMP/host" --work-root "$RUNNER_TEMP/probe-work" \
              --source-checkout "$GITHUB_WORKSPACE/host-source" --host-source "$HOST_SOURCE" --native-source "$NATIVE_SOURCE" \
              --normal "$RUNNER_TEMP/normal" --qa "$RUNNER_TEMP/qa" --apk-root "$RUNNER_TEMP/probe-apks" \
              --output "$RUNNER_TEMP/probe-evidence/result.json"
      - name: Independently inspect namespace and wrapper cleanup
        if: always()
        env:
          DEVICE_OUTCOME: ${{ steps.device.outcome }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'probe-evidence/result.json'
          path.parent.mkdir(parents=True,exist_ok=True)
          d=json.loads(path.read_text()) if path.exists() else {'status':'failed','errorCode':'probe_not_completed'}
          p=subprocess.run(['ip','netns','list'],capture_output=True,text=True)
          name='hp-dual-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          d['finalNamespaceAbsent']=p.returncode==0 and name not in [line.split()[0] for line in p.stdout.splitlines() if line.split()]
          d['avdWrapperSucceeded']=os.environ['DEVICE_OUTCOME']=='success'
          if not d['finalNamespaceAbsent'] or not d['avdWrapperSucceeded']:d['status']='failed'
          path.write_text(json.dumps(d,indent=2)+'\n')
          raise SystemExit(0 if d['status']=='passed' else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-ts-node-probe-${{ matrix.diagnostics }}-${{ github.sha }}
          path: ${{ runner.temp }}/probe-evidence/result.json
          if-no-files-found: error
          retention-days: 7
