name: Prototype validation batch
on:
  push:
    branches: ['codex/batch/**']
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: false
        description: Also run upstream network and transport feasibility probes
permissions:
  contents: read
concurrency:
  group: batch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  helper:
    if: >-
      !startsWith(github.ref, 'refs/heads/codex/batch/android-observe-') &&
      !startsWith(github.ref, 'refs/heads/codex/batch/android-input-')
    uses: ./.github/workflows/helper-validation.yml
  pairing:
    if: >-
      !startsWith(github.ref, 'refs/heads/codex/batch/phones-observe-') &&
      !startsWith(github.ref, 'refs/heads/codex/batch/android-observe-') &&
      !startsWith(github.ref, 'refs/heads/codex/batch/android-input-')
    uses: ./.github/workflows/pairing-validation.yml
  flutter:
    if: "!startsWith(github.ref, 'refs/heads/codex/batch/android-input-')"
    uses: ./.github/workflows/flutter-candidate-validation.yml
    with:
      android_only: ${{ startsWith(github.ref, 'refs/heads/codex/batch/android-') || startsWith(github.ref, 'refs/heads/codex/batch/phones-') }}
      include_ios: ${{ startsWith(github.ref, 'refs/heads/codex/batch/phones-') }}
  tauri:
    if: "!startsWith(github.ref, 'refs/heads/codex/batch/android-input-')"
    uses: ./.github/workflows/tauri-validation.yml
    with:
      android_only: ${{ startsWith(github.ref, 'refs/heads/codex/batch/android-') || startsWith(github.ref, 'refs/heads/codex/batch/phones-') }}
      include_ios: ${{ startsWith(github.ref, 'refs/heads/codex/batch/phones-') && !startsWith(github.ref, 'refs/heads/codex/batch/phones-observe-') }}
  android-emulator:
    if: "!startsWith(github.ref, 'refs/heads/codex/batch/android-input-')"
    uses: ./.github/workflows/paired-android-emulator.yml
  android-input-emulator:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/heads/codex/batch/android-input-') }}
    needs: build-input-fixture
    uses: ./.github/workflows/paired-android-emulator.yml
    with:
      guarded_input: ${{ needs.build-input-fixture.result == 'success' }}
      flutter_only: ${{ startsWith(github.ref, 'refs/heads/codex/batch/android-input-flutter-') }}
  transport:
    if: >-
      !startsWith(github.ref, 'refs/heads/codex/batch/phones-observe-') &&
      !startsWith(github.ref, 'refs/heads/codex/batch/android-observe-') &&
      !startsWith(github.ref, 'refs/heads/codex/batch/android-input-')
    uses: ./.github/workflows/mobile-remote-validation.yml
  build-input-fixture:
    if: >-
      !startsWith(github.ref, 'refs/heads/codex/batch/phones-observe-') &&
      !startsWith(github.ref, 'refs/heads/codex/batch/android-observe-')
    uses: ./.github/workflows/input-extension-validation.yml
  paired-input:
    if: "!startsWith(github.ref, 'refs/heads/codex/batch/android-input-')"
    needs: build-input-fixture
    uses: ./.github/workflows/paired-gui-validation.yml
    with:
      input_fixture: true
  paired-gui:
    if: "!startsWith(github.ref, 'refs/heads/codex/batch/android-input-')"
    uses: ./.github/workflows/paired-gui-validation.yml
    with:
      flutter_only: ${{ startsWith(github.ref, 'refs/heads/codex/batch/android-observe-') }}
  overlay-isolation:
    if: >-
      startsWith(github.ref, 'refs/heads/codex/batch/android-input-networks-') ||
      (!startsWith(github.ref, 'refs/heads/codex/batch/phones-observe-') &&
      !startsWith(github.ref, 'refs/heads/codex/batch/android-observe-') &&
      !startsWith(github.ref, 'refs/heads/codex/batch/android-input-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exercise stream ownership and cancellation with synthetic C ABI only
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          cargo +1.96.0 test --locked --offline --manifest-path validation/overlay-runtime/Cargo.toml --features native-fixture
      - name: Verify v1 and v2 portable configuration golden fixtures
        run: cargo +1.96.0 test --locked --manifest-path validation/transport-rust/Cargo.toml config_transfer
  native:
    if: inputs.full || startsWith(github.ref, 'refs/heads/codex/batch/full-') || startsWith(github.ref, 'refs/heads/codex/batch/android-input-networks-')
    uses: ./.github/workflows/native-candidate-validation.yml
  original-network-probes:
    if: inputs.full || startsWith(github.ref, 'refs/heads/codex/batch/full-')
    uses: ./.github/workflows/native-validation.yml
  original-ssh-probes:
    if: inputs.full || startsWith(github.ref, 'refs/heads/codex/batch/full-')
    uses: ./.github/workflows/ssh-validation.yml
