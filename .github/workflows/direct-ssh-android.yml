name: Ordinary SSH Android UI acceptance

on:
  workflow_dispatch:
    inputs:
      acceptance:
        description: 'Choose SSH acceptance or read-only documents preflight'
        type: choice
        options: [ssh, documents-preflight, documents-roundtrip]
        default: ssh
      auth_case:
        description: 'SSH acceptance case'
        type: choice
        options: [standard, encrypted-key, encrypted-key-rotation]
        default: standard
  push:
    branches:
      - 'codex/acceptance/direct-ssh-android-*'

permissions:
  contents: read

concurrency:
  group: direct-ssh-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flutter-ordinary-ssh:
    if: startsWith(github.ref, 'refs/heads/codex/') && inputs.acceptance != 'documents-preflight' && inputs.acceptance != 'documents-roundtrip'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - name: Install isolated protocol test dependencies and verify local guards
        run: |
          python3 -m venv "$RUNNER_TEMP/direct-ssh-python"
          "$RUNNER_TEMP/direct-ssh-python/bin/pip" install -r validation/pairing/requirements.txt 'paramiko==4.0.0' 'pillow==12.2.0'
          HERDR_REQUIRE_PARAMIKO=1 "$RUNNER_TEMP/direct-ssh-python/bin/python" -m unittest discover -s validation/remote-harness -p 'test_direct_ssh_android.py' -v
          HERDR_REQUIRE_PARAMIKO=1 "$RUNNER_TEMP/direct-ssh-python/bin/python" -m unittest discover -s validation/remote-harness -p 'test_direct_ssh_rotation_fixture.py' -v
      - name: Prepare pinned Flutter and Android build tools
        run: |
          python3 validation/flutter/tool/ci.py bootstrap --destination "$RUNNER_TEMP/direct-ssh-sdk"
          export PATH="$RUNNER_TEMP/direct-ssh-sdk/bin:$PATH"
          flutter precache --android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          sudo apt-get update
          sudo apt-get install -y acl libpulse0 libgl1 libgl1-mesa-dri libnss3 libxkbcommon-x11-0 libxcb-cursor0 tesseract-ocr=5.3.4-1build5 tesseract-ocr-eng=1:4.1.0-2
          HERDR_REQUIRE_SCREENSHOT_OCR=1 "$RUNNER_TEMP/direct-ssh-python/bin/python" -m unittest discover -s validation/remote-harness -p 'test_terminal_screenshot_gate.py' -v
      - name: Prepare the actual production application with SDK-only integration tests
        run: |
          export PATH="$RUNNER_TEMP/direct-ssh-sdk/bin:$PATH"
          python3 validation/flutter/tool/ci.py prepare --destination "$RUNNER_TEMP/direct-ssh-app"
          python3 validation/flutter/tool/candidate.py apply --destination "$RUNNER_TEMP/direct-ssh-app"
          cd "$RUNNER_TEMP/direct-ssh-app"
          flutter pub get
          python3 "$GITHUB_WORKSPACE/validation/flutter/tool/candidate.py" verify-lock --destination "$RUNNER_TEMP/direct-ssh-app"
          python3 "$GITHUB_WORKSPACE/validation/flutter/tool/android_device_test.py" prepare --destination "$RUNNER_TEMP/direct-ssh-app"
          flutter pub get
          python3 "$GITHUB_WORKSPACE/validation/flutter/tool/android_device_test.py" verify-lock --destination "$RUNNER_TEMP/direct-ssh-app"
          flutter analyze lib integration_test test/android_connect_diagnostic_test.dart
          flutter test --no-pub test/android_connect_diagnostic_test.dart
      - name: Prebuild the encrypted-key integration target without a device
        if: ${{ inputs.auth_case == 'encrypted-key' || inputs.auth_case == 'encrypted-key-rotation' }}
        run: |
          export PATH="$RUNNER_TEMP/direct-ssh-sdk/bin:$PATH"
          cd "$RUNNER_TEMP/direct-ssh-app"
          flutter build apk --debug --target-platform android-x64 --no-pub -t integration_test/android_direct_ssh_test.dart
      - name: Drive homepage, host key rotation, ordinary SSH input and disconnect on an owned API35 AVD
        env:
          AUTH_CASE: ${{ inputs.auth_case }}
        run: |
          export PATH="$RUNNER_TEMP/direct-ssh-sdk/bin:$PATH"
          case "${AUTH_CASE:-}" in
            ''|standard) set -- ;;
            encrypted-key) set -- --encrypted-key ;;
            encrypted-key-rotation) set -- --encrypted-key-rotation ;;
            *) echo 'unsupported SSH acceptance case' >&2; exit 1 ;;
          esac
          AVD_EVIDENCE_DIR="$RUNNER_TEMP/direct-ssh-avd" bash validation/remote-harness/with-android-emulator.sh \
            "$RUNNER_TEMP/direct-ssh-python/bin/python" validation/remote-harness/flutter_direct_ssh_android.py \
            --project "$RUNNER_TEMP/direct-ssh-app" --output "$RUNNER_TEMP/direct-ssh-public" "$@"
      - name: Upload only sanitized device evidence and post-credential screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flutter-ordinary-ssh-android-${{ github.sha }}
          path: |
            ${{ runner.temp }}/direct-ssh-public/
            ${{ runner.temp }}/direct-ssh-avd/
          if-no-files-found: warn

  flutter-documents-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance == 'documents-preflight' && startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - name: Prepare production entry and candidate dependency
        run: |
          python3 validation/flutter/tool/ci.py bootstrap --destination "$RUNNER_TEMP/documents-sdk"
          export PATH="$RUNNER_TEMP/documents-sdk/bin:$PATH"
          flutter precache --android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          sudo apt-get update
          sudo apt-get install -y acl libpulse0 libgl1 libgl1-mesa-dri libnss3 libxkbcommon-x11-0 libxcb-cursor0
          python3 validation/flutter/tool/ci.py prepare --destination "$RUNNER_TEMP/documents-app"
          python3 validation/flutter/tool/candidate.py apply --destination "$RUNNER_TEMP/documents-app"
          cd "$RUNNER_TEMP/documents-app"
          flutter pub get
          python3 "$GITHUB_WORKSPACE/validation/flutter/tool/candidate.py" verify-lock --destination "$RUNNER_TEMP/documents-app"
          flutter build apk --debug --target-platform android-x64 --no-pub -t lib/main.dart
      - name: Inspect read-only production UI on an owned API35 emulator
        run: |
          AVD_EVIDENCE_DIR="$RUNNER_TEMP/documents-avd" bash validation/remote-harness/with-android-emulator.sh \
            python3 validation/remote-harness/flutter_android_documents_preflight.py \
            --apk "$RUNNER_TEMP/documents-app/build/app/outputs/flutter-apk/app-debug.apk" \
            --output "$RUNNER_TEMP/documents-public"
      - name: Upload sanitized preflight and emulator lifecycle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flutter-documents-preflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/documents-public/
            ${{ runner.temp }}/documents-avd/
          if-no-files-found: warn

  flutter-documents-roundtrip:
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance == 'documents-roundtrip' && startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - name: Prepare isolated test dependencies and verify guards
        run: |
          python3 -m venv "$RUNNER_TEMP/documents-python"
          "$RUNNER_TEMP/documents-python/bin/pip" install -r validation/pairing/requirements.txt 'paramiko==4.0.0'
          "$RUNNER_TEMP/documents-python/bin/python" -m unittest discover -s validation/remote-harness -p 'test_flutter_android_documents*.py' -v
          "$RUNNER_TEMP/documents-python/bin/python" -m unittest discover -s validation/remote-harness -p 'test_tauri_android_config_document.py' -v
      - name: Prepare production sources and integration-test wrapper
        run: |
          python3 validation/flutter/tool/ci.py bootstrap --destination "$RUNNER_TEMP/documents-sdk"
          export PATH="$RUNNER_TEMP/documents-sdk/bin:$PATH"
          flutter precache --android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          sudo apt-get update
          sudo apt-get install -y acl libpulse0 libgl1 libgl1-mesa-dri libnss3 libxkbcommon-x11-0 libxcb-cursor0
          python3 validation/flutter/tool/ci.py prepare --destination "$RUNNER_TEMP/documents-app"
          python3 validation/flutter/tool/candidate.py apply --destination "$RUNNER_TEMP/documents-app"
          cd "$RUNNER_TEMP/documents-app"
          flutter pub get
          python3 "$GITHUB_WORKSPACE/validation/flutter/tool/candidate.py" verify-lock --destination "$RUNNER_TEMP/documents-app"
          python3 "$GITHUB_WORKSPACE/validation/flutter/tool/android_device_test.py" prepare --destination "$RUNNER_TEMP/documents-app"
          flutter pub get
          python3 "$GITHUB_WORKSPACE/validation/flutter/tool/android_device_test.py" verify-lock --destination "$RUNNER_TEMP/documents-app"
          cp "$GITHUB_WORKSPACE/validation/remote-harness/flutter_android_documents_device_test.dart" integration_test/flutter_android_documents_device_test.dart
          flutter analyze integration_test/flutter_android_documents_device_test.dart
          flutter build apk --debug --target-platform android-x64 --no-pub --dart-define=HERDR_ANDROID_DOCUMENTS=1 --dart-define="HERDR_ANDROID_DOCUMENTS_RUN_ID=$GITHUB_RUN_ID" -t integration_test/flutter_android_documents_device_test.dart
      - name: Install the pinned emulator in the job's private directory
        run: |
          archive="$RUNNER_TEMP/documents-emulator-16740729.zip"
          curl --fail --location --silent --show-error --max-time 600 \
            'https://redirector.gvt1.com/edgedl/android/repository/emulator-linux_x64-16740729.zip' --output "$archive"
          test "$(stat -c %s "$archive")" = 349658551
          printf '%s  %s\n' cbc7c3cfb83220b8a0f9c513fdab557712e74d339ec19ddffa43f23350ae9bdd "$archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/documents-emulator" "$RUNNER_TEMP/documents-avd"
          unzip -q "$archive" -d "$RUNNER_TEMP/documents-emulator"
          printf '%s\n' cbc7c3cfb83220b8a0f9c513fdab557712e74d339ec19ddffa43f23350ae9bdd > "$RUNNER_TEMP/documents-avd/emulator-archive-sha256.txt"
      - name: Run integration-test wrapper with real system DocumentsUI
        run: |
          export PATH="$RUNNER_TEMP/documents-sdk/bin:$PATH"
          AVD_EMULATOR_LAUNCHER="$RUNNER_TEMP/documents-emulator/emulator/emulator" \
          AVD_EXPECTED_EMULATOR_VERSION='Android emulator version 37.2.13.0 (build_id 16740729) (CL:N/A)' \
          AVD_EXPECTED_IMAGE_REVISION=9 \
          AVD_EVIDENCE_DIR="$RUNNER_TEMP/documents-avd" bash validation/remote-harness/with-android-emulator.sh \
            "$RUNNER_TEMP/documents-python/bin/python" validation/remote-harness/flutter_android_documents_device.py \
            --project "$RUNNER_TEMP/documents-app" --output "$RUNNER_TEMP/documents-public"
      - name: Upload only sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flutter-documents-roundtrip-${{ github.sha }}
          path: |
            ${{ runner.temp }}/documents-public/
            ${{ runner.temp }}/documents-avd/
          if-no-files-found: warn
