name: Ordinary SSH and S10 iOS Simulator UI acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/acceptance/direct-ssh-ios-*'

permissions:
  contents: read

concurrency:
  group: direct-ssh-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flutter-ordinary-ssh-ios:
    if: >-
      startsWith(github.ref, 'refs/heads/codex/acceptance/direct-ssh-ios-') &&
      !startsWith(github.ref, 'refs/heads/codex/acceptance/direct-ssh-ios-tauri-only-') &&
      (!startsWith(github.ref, 'refs/heads/codex/acceptance/direct-ssh-ios-flutter-only-encrypted-rotation-') || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FLUTTER_INCLUDE_ENCRYPTED_KEY: ${{ startsWith(github.ref, 'refs/heads/codex/acceptance/direct-ssh-ios-flutter-only-encrypted-key-') }}
      FLUTTER_ENCRYPTED_ROTATION: ${{ startsWith(github.ref, 'refs/heads/codex/acceptance/direct-ssh-ios-flutter-only-encrypted-rotation-') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record the simulator host and selected Apple SDK
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list runtimes
      - name: Prepare isolated Python and verify guards
        run: |
          python3 -m venv "$RUNNER_TEMP/direct-ssh-python"
          "$RUNNER_TEMP/direct-ssh-python/bin/pip" install -r validation/pairing/requirements.txt 'paramiko==4.0.0' 'pillow==12.2.0'
          HERDR_REQUIRE_PARAMIKO=1 "$RUNNER_TEMP/direct-ssh-python/bin/python" -m unittest discover -s validation/remote-harness -p 'test_direct_ssh_ios.py' -v
          HERDR_REQUIRE_PARAMIKO=1 "$RUNNER_TEMP/direct-ssh-python/bin/python" -m unittest discover -s validation/remote-harness -p 'test_direct_ssh_rotation_fixture.py' -v
          HERDR_REQUIRE_PARAMIKO=1 "$RUNNER_TEMP/direct-ssh-python/bin/python" -m unittest discover -s validation/remote-harness -p 'test_direct_ssh_fixture_deadline.py' -v
          "$RUNNER_TEMP/direct-ssh-python/bin/python" -m unittest discover -s validation/remote-harness -p 'test_ios_direct_ssh_batch.py' -v
          "$RUNNER_TEMP/direct-ssh-python/bin/python" -m unittest discover -s validation/remote-harness -p 'test_flutter_ios_encrypted_key.py' -v
      - name: Prepare terminal screenshot OCR
        run: |
          brew install tesseract
          HERDR_REQUIRE_SCREENSHOT_OCR=1 "$RUNNER_TEMP/direct-ssh-python/bin/python" -m unittest discover -s validation/remote-harness -p 'test_terminal_screenshot_gate.py' -v
      - name: Prepare pinned Flutter
        run: |
          python3 validation/flutter/tool/ci.py bootstrap --destination "$RUNNER_TEMP/direct-ssh-sdk"
          export PATH="$RUNNER_TEMP/direct-ssh-sdk/bin:$PATH"
          flutter config --no-enable-swift-package-manager
          flutter precache --ios
      - name: Prepare production application and SDK-only integration tests
        run: |
          export PATH="$RUNNER_TEMP/direct-ssh-sdk/bin:$PATH"
          python3 validation/flutter/tool/ci.py prepare --destination "$RUNNER_TEMP/direct-ssh-app"
          python3 validation/flutter/tool/candidate.py apply --destination "$RUNNER_TEMP/direct-ssh-app"
          cd "$RUNNER_TEMP/direct-ssh-app"
          flutter pub get
          python3 "$GITHUB_WORKSPACE/validation/flutter/tool/candidate.py" verify-lock --destination "$RUNNER_TEMP/direct-ssh-app"
          python3 "$GITHUB_WORKSPACE/validation/flutter/tool/android_device_test.py" prepare --destination "$RUNNER_TEMP/direct-ssh-app"
          flutter pub get
          python3 "$GITHUB_WORKSPACE/validation/flutter/tool/android_device_test.py" verify-lock --destination "$RUNNER_TEMP/direct-ssh-app"
          flutter analyze lib integration_test
          cp integration_test/direct_ssh_tap_test.dart test/direct_ssh_tap_test.dart
          HERDR_FIXTURE_PYTHON="$RUNNER_TEMP/direct-ssh-python/bin/python" flutter test test/direct_ssh_tap_test.dart test/direct_ssh_keyboard_viewport_test.dart test/direct_ssh_pre_auth_failure_test.dart --reporter expanded
          cp integration_test/ios_semantics_fixture.dart test/ios_semantics_fixture_test.dart
          flutter test test/ios_semantics_fixture_test.dart --plain-name 'stable semantics baseline is preserved' --reporter expanded
          if flutter test test/ios_semantics_fixture_test.dart --plain-name 'additional leaked handle remains detectable' --reporter expanded > "$RUNNER_TEMP/semantics-negative.log" 2>&1; then
            echo 'Leaked semantics handle unexpectedly passed.'; exit 1
          fi
          grep -Fq 'A SemanticsHandle was active at the end of the test' "$RUNNER_TEMP/semantics-negative.log"
      - name: Drive real UI with loopback SSH on a disposable iOS Simulator
        run: |
          export PATH="$RUNNER_TEMP/direct-ssh-sdk/bin:$PATH"
          options=()
          if [[ "$FLUTTER_INCLUDE_ENCRYPTED_KEY" == true ]]; then options+=(--include-encrypted-key); fi
          if [[ "$FLUTTER_ENCRYPTED_ROTATION" == true ]]; then options+=(--encrypted-key-rotation); fi
          "$RUNNER_TEMP/direct-ssh-python/bin/python" validation/remote-harness/flutter_direct_ssh_ios.py \
            --project "$RUNNER_TEMP/direct-ssh-app" --output "$RUNNER_TEMP/direct-ssh-public" "${options[@]}"
      - name: Remove isolated app even if preparation or the runner failed
        if: always()
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP']).resolve()
          app = base / 'direct-ssh-app'
          if app.is_symlink():
              app.unlink()
          elif app.exists():
              shutil.rmtree(app)
          if app.exists() or app.is_symlink():
              raise SystemExit('isolated app cleanup failed')
          PY
      - name: Verify source-bound public evidence for this batch
        if: always()
        run: |
          options=()
          if [[ "$FLUTTER_INCLUDE_ENCRYPTED_KEY" == true ]]; then options+=(--include-encrypted-key); fi
          if [[ "$FLUTTER_ENCRYPTED_ROTATION" == true ]]; then options+=(--encrypted-key-rotation); fi
          "$RUNNER_TEMP/direct-ssh-python/bin/python" validation/remote-harness/ios_direct_ssh_batch.py publish \
            --shell flutter --source-sha "$GITHUB_SHA" \
            --root "$RUNNER_TEMP/direct-ssh-public" --destination "$RUNNER_TEMP/direct-ssh-verified" "${options[@]}"
      - name: Upload sanitized evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flutter-ordinary-ssh-ios-${{ github.sha }}
          path: |
            ${{ runner.temp }}/direct-ssh-verified/result.json
            ${{ runner.temp }}/direct-ssh-verified/ordinary-terminal.png
            ${{ runner.temp }}/direct-ssh-verified/ordinary-terminal-ocr.json
            ${{ runner.temp }}/direct-ssh-verified/key-change-review.png
            ${{ runner.temp }}/direct-ssh-verified/key-change-terminal.png
            ${{ runner.temp }}/direct-ssh-verified/key-change-terminal-ocr.json
            ${{ runner.temp }}/direct-ssh-verified/preconnect.png
            ${{ runner.temp }}/direct-ssh-verified/encrypted-key-terminal.png
            ${{ runner.temp }}/direct-ssh-verified/encrypted-key-terminal-ocr.json
            ${{ runner.temp }}/direct-ssh-verified/encrypted-rotation-review.png
            ${{ runner.temp }}/direct-ssh-verified/encrypted-rotation-terminal.png
            ${{ runner.temp }}/direct-ssh-verified/encrypted-rotation-terminal-ocr.json
          if-no-files-found: warn

  tauri-ordinary-ssh-ios:
    if: >-
      startsWith(github.ref, 'refs/heads/codex/acceptance/direct-ssh-ios-') &&
      !startsWith(github.ref, 'refs/heads/codex/acceptance/direct-ssh-ios-flutter-only-') &&
      (!startsWith(github.ref, 'refs/heads/codex/acceptance/direct-ssh-ios-tauri-only-encrypted-manual-') || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CI: 'true'
      TAURI_ENCRYPTED_KEY_MANUAL: ${{ startsWith(github.ref, 'refs/heads/codex/acceptance/direct-ssh-ios-tauri-only-encrypted-manual-') }}
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record the simulator host and selected Apple SDK
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list runtimes
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: validation/tauri/package-lock.json
      - name: Prepare pinned Rust simulator target
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add aarch64-apple-ios-sim
      - name: Prepare isolated Python and terminal screenshot OCR
        run: |
          python3 -m venv "$RUNNER_TEMP/direct-ssh-python"
          "$RUNNER_TEMP/direct-ssh-python/bin/pip" install -r validation/pairing/requirements.txt 'paramiko==4.0.0' 'pillow==12.2.0'
          brew install tesseract xcodegen
          HERDR_REQUIRE_PARAMIKO=1 "$RUNNER_TEMP/direct-ssh-python/bin/python" -m unittest discover -s validation/remote-harness -p 'test_tauri_ios_direct_ssh.py' -v
          "$RUNNER_TEMP/direct-ssh-python/bin/python" -m unittest discover -s validation/remote-harness -p 'test_tauri_ios_native_controls.py' -v
          HERDR_REQUIRE_PARAMIKO=1 "$RUNNER_TEMP/direct-ssh-python/bin/python" -m unittest discover -s validation/remote-harness -p 'test_direct_ssh_rotation_fixture.py' -v
          HERDR_REQUIRE_SCREENSHOT_OCR=1 "$RUNNER_TEMP/direct-ssh-python/bin/python" -m unittest discover -s validation/remote-harness -p 'test_terminal_screenshot_gate.py' -v
          "$RUNNER_TEMP/direct-ssh-python/bin/python" -m unittest discover -s validation/remote-harness -p 'test_ios_direct_ssh_batch.py' -v
      - name: Build the production Tauri arm64 iOS Simulator application
        working-directory: validation/tauri
        run: |
          npm ci
          npm run build
          npm run tauri -- icon icon.svg
          npm run tauri -- ios init --ci
          npm run tauri -- ios build --debug --target aarch64-sim --no-sign --archive-only --ci
      - name: Select the unique simulator application inside the archive
        run: |
          TAURI_IOS_APP=$("$RUNNER_TEMP/direct-ssh-python/bin/python" validation/remote-harness/ios_direct_ssh_batch.py select-app --root validation/tauri/src-tauri/gen/apple)
          echo "TAURI_IOS_APP=$TAURI_IOS_APP" >> "$GITHUB_ENV"
      - name: Drive the selected SSH scenarios through the real Tauri application
        run: |
          options=()
          if [[ "$TAURI_ENCRYPTED_KEY_MANUAL" == true ]]; then options+=(--encrypted-key-manual-only); fi
          "$RUNNER_TEMP/direct-ssh-python/bin/python" validation/remote-harness/tauri_ios_direct_ssh.py \
            --project validation/tauri/src-tauri/gen/apple \
            --app "$TAURI_IOS_APP" --output "$RUNNER_TEMP/tauri-direct-ssh-public" "${options[@]}"
      - name: Verify source-bound public evidence for this batch
        if: always()
        run: |
          options=()
          if [[ "$TAURI_ENCRYPTED_KEY_MANUAL" == true ]]; then options+=(--encrypted-key-manual-only); fi
          "$RUNNER_TEMP/direct-ssh-python/bin/python" validation/remote-harness/ios_direct_ssh_batch.py publish \
            --shell tauri --source-sha "$GITHUB_SHA" \
            --root "$RUNNER_TEMP/tauri-direct-ssh-public" --destination "$RUNNER_TEMP/tauri-direct-ssh-verified" "${options[@]}"
      - name: Upload sanitized evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tauri-ordinary-ssh-ios-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tauri-direct-ssh-verified/result.json
            ${{ runner.temp }}/tauri-direct-ssh-verified/ordinary-terminal.png
            ${{ runner.temp }}/tauri-direct-ssh-verified/ordinary-terminal-ocr.json
            ${{ runner.temp }}/tauri-direct-ssh-verified/key-change-review.png
            ${{ runner.temp }}/tauri-direct-ssh-verified/key-change-terminal.png
            ${{ runner.temp }}/tauri-direct-ssh-verified/key-change-terminal-ocr.json
            ${{ runner.temp }}/tauri-direct-ssh-verified/tauri-manual-key-empty-home.png
            ${{ runner.temp }}/tauri-direct-ssh-verified/tauri-manual-key-terminal.png
            ${{ runner.temp }}/tauri-direct-ssh-verified/tauri-manual-key-terminal-ocr.json
          if-no-files-found: warn
