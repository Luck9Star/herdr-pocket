name: Flutter Android dual-overlay debug APK preparation
on:
  workflow_dispatch:
  push:
    branches: ['codex/acceptance-flutter-dual-apk/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: flutter-dual-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    if: startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [normal, private-ca-qa]
    env:
      NATIVE_SOURCE: 547106ea172dfd055c3bf9fdb2f4e2a27c9ff2f8
      NATIVE_RUN: '43939326685'
      NATIVE_NORMAL_ARTIFACT: '14261768985'
      NATIVE_NORMAL_ZIP_SHA256: 23bdd1d79ded537d64fec25e9926f56a75c7ac3bf0f6f1b71e517bf67e8e0f3d
      NATIVE_QA_ARTIFACT: '14261004231'
      NATIVE_QA_ZIP_SHA256: ac4fbf7c5c5de8d6aa1c0f695fdf0e5f43a1e7a9afa98a1b3a57e47695f1c769
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NATIVE_SOURCE }}
          path: native-source
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - name: Test APK inventory guards
        run: python3 -m unittest discover -s validation/flutter/tool -p 'test_dual_overlay_apk.py' -v
      - name: Fetch and verify fixed native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for role in normal qa; do
            if [[ "$role" == normal ]]; then artifact="$NATIVE_NORMAL_ARTIFACT"; else artifact="$NATIVE_QA_ARTIFACT"; fi
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > "$RUNNER_TEMP/$role-meta.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/$role.zip"
          done
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          for role,expected_name in [('normal','android-dual-native-x86_64-'),('qa','android-dual-native-QA-ONLY-x86_64-')]:
              meta=json.loads((root/f'{role}-meta.json').read_text())
              expected=os.environ[f'NATIVE_{role.upper()}_ZIP_SHA256']
              assert meta['expired'] is False
              assert str(meta['workflow_run']['id'])==os.environ['NATIVE_RUN']
              assert meta['workflow_run']['head_sha']==os.environ['NATIVE_SOURCE']
              assert meta['name']==expected_name+os.environ['NATIVE_SOURCE']
              assert meta['digest']=='sha256:'+expected
              assert hashlib.sha256((root/f'{role}.zip').read_bytes()).hexdigest()==expected
          PY
          mkdir "$RUNNER_TEMP/normal" "$RUNNER_TEMP/qa"
          unzip -q "$RUNNER_TEMP/normal.zip" -d "$RUNNER_TEMP/normal"
          unzip -q "$RUNNER_TEMP/qa.zip" -d "$RUNNER_TEMP/qa"
          test "$(sha256sum "$RUNNER_TEMP/normal/manifest.json" | cut -d' ' -f1)" = c8925548dd8dbde75d5653638c3d8734df607dab1be04c57359012d7162b2fa5
      - name: Prepare fixed Flutter and Android SDKs
        run: |
          python3 validation/flutter/tool/ci.py bootstrap --destination "$RUNNER_TEMP/flutter-sdk"
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter-sdk/bin/flutter" precache --android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Verify fixed normal and QA native inputs
        run: |
          readelf="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          python3 native-source/validation/native/tool/android_bundle.py verify "$RUNNER_TEMP/normal" --abi x86_64 --commit "$NATIVE_SOURCE" --readelf "$readelf"
          python3 native-source/validation/native/tool/android_dual_qa_bundle.py verify --normal "$RUNNER_TEMP/normal" --qa "$RUNNER_TEMP/qa" --commit "$NATIVE_SOURCE" --readelf "$readelf"
      - name: Build isolated production UI debug APK
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 validation/flutter/tool/ci.py prepare --destination "$RUNNER_TEMP/flutter-dual-app"
          python3 validation/flutter/tool/candidate.py apply --destination "$RUNNER_TEMP/flutter-dual-app"
          cd "$RUNNER_TEMP/flutter-dual-app"
          flutter pub get
          python3 "$GITHUB_WORKSPACE/validation/flutter/tool/candidate.py" verify-lock --destination "$RUNNER_TEMP/flutter-dual-app"
          bundle="$RUNNER_TEMP/normal"
          if [ "$VARIANT" = private-ca-qa ]; then bundle="$RUNNER_TEMP/qa"; fi
          python3 "$GITHUB_WORKSPACE/validation/flutter/tool/dual_overlay_apk.py" install --bundle "$bundle" --project "$RUNNER_TEMP/flutter-dual-app"
          echo 'android { packaging { jniLibs.keepDebugSymbols += "**/libherdr_flutter_network_runtime.so" } }' >> android/app/build.gradle.kts
          flutter build apk --debug --target-platform android-x64
          mkdir "$RUNNER_TEMP/apk-evidence"
          cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/apk-evidence/app-debug.apk"
          python3 "$GITHUB_WORKSPACE/validation/flutter/tool/dual_overlay_apk.py" verify --bundle "$bundle" --apk "$RUNNER_TEMP/apk-evidence/app-debug.apk" > "$RUNNER_TEMP/apk-evidence/manifest.json"
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"apk-evidence/manifest.json"; d=json.loads(p.read_text()); d.update(uiSource=os.environ["GITHUB_SHA"],nativeSource=os.environ["NATIVE_SOURCE"],variant=os.environ["VARIANT"],instrumentationIncluded=False,deviceTest="not run"); p.write_text(json.dumps(d,indent=2)+"\n")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flutter-dual-overlay-${{ matrix.variant }}-${{ github.sha }}
          path: ${{ runner.temp }}/apk-evidence/
          if-no-files-found: error
          retention-days: 7
