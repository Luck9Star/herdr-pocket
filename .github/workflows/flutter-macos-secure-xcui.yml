name: Flutter macOS secure field XCUITest (opt-in)
on:
  push:
    branches: ['codex/acceptance/macos-secure-design-parity', 'codex/acceptance/macos-secure-baseline']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-secure-fields:
    if: startsWith(github.ref, 'refs/heads/codex/')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install locked Flutter SDK
        run: python3 validation/flutter/tool/ci.py bootstrap --destination "$RUNNER_TEMP/flutter-sdk"
      - name: Prepare owned candidate app
        run: |
          python3 -m venv "$RUNNER_TEMP/macos-secure-venv"
          "$RUNNER_TEMP/macos-secure-venv/bin/pip" install paramiko==4.0.0
          python3 validation/flutter/tool/ci.py prepare --destination "$RUNNER_TEMP/flutter-probe"
          python3 validation/flutter/tool/candidate.py apply --destination "$RUNNER_TEMP/flutter-probe"
          cd "$RUNNER_TEMP/flutter-probe"
          flutter pub get
          python3 "$GITHUB_WORKSPACE/validation/flutter/tool/candidate.py" verify-lock --destination "$RUNNER_TEMP/flutter-probe"
          flutter build macos --debug
          if [ "$GITHUB_REF" = 'refs/heads/codex/acceptance/macos-secure-design-parity' ]; then
            python3 "$GITHUB_WORKSPACE/validation/flutter/tool/ci.py" package --destination "$RUNNER_TEMP/flutter-probe" --platform macos --output "$RUNNER_TEMP/macos-clean-output"
            python3 - "$RUNNER_TEMP/macos-clean-output/xcui-package-scope.json" <<'PY'
          import json,sys
          with open(sys.argv[1],'w') as f:
              json.dump({'builtBeforeXcuiHook':True,'containsTestFixture':False,'runtimeEvidenceUsesInstrumentedApp':True},f,indent=2);f.write('\n')
          PY
          fi
      - name: Run native XCUITest without exporting UI snapshots or logs
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/macos-secure-evidence"
          mkdir -m 700 "$RUNNER_TEMP/macos-secure-fixture"
          "$RUNNER_TEMP/macos-secure-venv/bin/python" validation/remote-harness/macos_secure_xcui_fixture.py "$RUNNER_TEMP/macos-secure-fixture" > "$RUNNER_TEMP/macos-fixture-private.log" 2>&1 &
          fixture_pid=$!
          trap 'touch "$RUNNER_TEMP/macos-secure-fixture/stop"; wait "$fixture_pid" || true; python3 -c "import shutil,sys; shutil.rmtree(sys.argv[1],ignore_errors=True)" "$RUNNER_TEMP/macos-secure-fixture"' EXIT
          for attempt in {1..100}; do test -s "$RUNNER_TEMP/macos-secure-fixture/fixture.json" && break; kill -0 "$fixture_pid"; sleep 0.1; done
          test -s "$RUNNER_TEMP/macos-secure-fixture/fixture.json"
          python3 validation/remote-harness/macos_secure_xcuitest.py --app "$RUNNER_TEMP/flutter-probe" --install-hook
          python3 validation/remote-harness/macos_secure_xcuitest.py --app "$RUNNER_TEMP/flutter-probe" --fixture "$RUNNER_TEMP/macos-secure-fixture/fixture.json"
          set +e
          python3 - "$RUNNER_TEMP/macos-secure-private.log" "$RUNNER_TEMP/macos-secure-fixture/facts.json" "$RUNNER_TEMP/macos-secure-private-live.json" \
            xcodebuild test -workspace "$RUNNER_TEMP/flutter-probe/macos/Runner.xcworkspace" \
            -scheme Runner -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/macos-secure-derived" \
            -resultBundlePath "$RUNNER_TEMP/macos-secure-private.xcresult" <<'PY'
          import json, subprocess, sys, time
          log_path, facts_path, live_path = sys.argv[1:4]
          fields = ('authAccepted', 'ptyRequested', 'shellRequested', 'sessionClosed', 'connectionsClosed')
          names = {'password': 'password', 'key': 'encryptedKey'}
          active = {name: False for name in names}
          attempting = {name: False for name in names}
          before = {name: False for name in names}
          verified = {name: False for name in names}
          ended = {name: False for name in names}
          with open(log_path, 'wb') as output:
              process = subprocess.Popen(sys.argv[4:], stdout=output, stderr=subprocess.STDOUT)
              with open(log_path, 'rb') as source:
                  pending = b''
                  while process.poll() is None:
                      pending += source.read()
                      lines = pending.split(b'\n')
                      pending = lines.pop()
                      chunk = b'\n'.join(lines).decode('utf-8', errors='replace').lower()
                      for name in names:
                          if 'hp_xcui_stage=' + name + 'disconnectattempt' in chunk and not ended[name]:
                              attempting[name] = True
                          if 'hp_xcui_stage=' + name + 'disconnecttapped' in chunk and not ended[name]:
                              attempting[name] = False
                              active[name] = True
                          if 'hp_xcui_stage=' + name + 'disconnectwindowended' in chunk:
                              active[name] = False
                              ended[name] = True
                      if any(active.values()) or any(attempting.values()):
                          try:
                              with open(facts_path) as facts_file: facts = json.load(facts_file)
                              for name, peer in names.items():
                                  if attempting[name] and process.poll() is None and all(facts[peer].get(field) is True for field in fields[:3]) and all(facts[peer].get(field) is False for field in fields[3:]):
                                      before[name] = True
                                  if active[name] and before[name] and process.poll() is None and all(facts[peer].get(field) is True for field in fields):
                                      verified[name] = True
                          except (OSError, ValueError, KeyError, TypeError, AttributeError):
                              pass
                      time.sleep(0.05)
              result = process.wait()
          with open(live_path, 'w') as live_file: json.dump({name: verified[name] and ended[name] for name in names}, live_file)
          sys.exit(result)
          PY
          result=$?
          set -e
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/macos-secure-private.xcresult" --format json > "$RUNNER_TEMP/macos-secure-private-summary.json" 2>/dev/null || true
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/macos-secure-private.xcresult" --format json > "$RUNNER_TEMP/macos-secure-private-tests.json" 2>/dev/null || true
          xcrun xcresulttool get test-results insights --path "$RUNNER_TEMP/macos-secure-private.xcresult" --format json > "$RUNNER_TEMP/macos-secure-private-insights.json" 2>/dev/null || true
          test_id=$(python3 - "$RUNNER_TEMP/macos-secure-private-tests.json" <<'PY'
          import json,re,sys
          try: root=json.load(open(sys.argv[1]))
          except (OSError,ValueError): root={}
          def find(value):
              if isinstance(value,dict):
                  for key in ('nodeIdentifier','testIdentifier','testIdentifierURL','identifier'):
                      item=value.get(key)
                      if isinstance(item,str) and any(name in item for name in ('testSystemMasking','testPasswordSSH','testEncryptedKeySSH','testReturnAndReopen')) and re.fullmatch(r'[A-Za-z0-9_./():%+-]+',item): return item
                  for item in value.values():
                      found=find(item)
                      if found:return found
              elif isinstance(value,list):
                  for item in value:
                      found=find(item)
                      if found:return found
              return None
          print(find(root) or '')
          PY
          )
          if test -n "$test_id"; then
            xcrun xcresulttool get test-results test-details --path "$RUNNER_TEMP/macos-secure-private.xcresult" --test-id "$test_id" --format json > "$RUNNER_TEMP/macos-secure-private-details.json" 2>/dev/null || true
          fi
          for attempt in {1..100}; do
            if python3 - "$RUNNER_TEMP/macos-secure-fixture/facts.json" <<'PY'
          import json,sys
          try:
              facts=json.load(open(sys.argv[1]))
              assert all(all(facts[name].get(k) is True for k in ('authAccepted','ptyRequested','shellRequested','sessionClosed','connectionsClosed')) for name in ('password','encryptedKey'))
          except (OSError,ValueError,AssertionError,KeyError,TypeError):
              sys.exit(1)
          PY
            then break; fi
            sleep 0.1
          done
          python3 - "$RUNNER_TEMP/macos-secure-evidence/result.json" "$result" <<'PY'
          import json, os, re, sys
          sha=os.environ.get('GITHUB_SHA','')
          try:
              with open(os.path.join(os.environ['RUNNER_TEMP'],'macos-secure-private-live.json')) as source: live=json.load(source)
              password_live_peer=live.get('password') is True
              key_live_peer=live.get('key') is True
          except (OSError,ValueError,TypeError,AttributeError): password_live_peer=key_live_peer=False
          live_peer=password_live_peer and key_live_peer
          try:
              facts=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'macos-secure-fixture','facts.json')))
              valid=lambda value: all(value.get(k) is True for k in ('authAccepted','ptyRequested','shellRequested','sessionClosed','connectionsClosed'))
              peer=valid(facts['password']); key_peer=valid(facts['encryptedKey'])
              peer_connections={name:min(facts[name]['connections'],100) for name in ('password','encryptedKey') if type(facts[name].get('connections')) is int and facts[name]['connections']>=0}
          except (OSError,ValueError,KeyError,TypeError,AttributeError): peer=key_peer=False;peer_connections={}
          try:
              log=open(os.path.join(os.environ['RUNNER_TEMP'],'macos-secure-private.log'),errors='replace').read().lower()
          except OSError: log=''
          permission = any(text in log for text in ('not authorized to use accessibility', 'not authorized to control', 'accessibility access is not enabled'))
          # Only bounded, redacted test-source compiler diagnostics; never upload the private log.
          diagnostics=[]
          for line in log.splitlines():
              match=re.search(r'runnertests\.swift:(\d+):(?:\d+:)?\s*error: (.*)',line)
              if not match: continue
              message=match.group(2)
              if message.startswith('-['): continue  # XCTest assertion, not a compiler error.
              message='swift_compile_error'
              diagnostic={'file':'RunnerTests.swift','line':int(match.group(1)),'message':message}
              if message and diagnostic not in diagnostics: diagnostics.append(diagnostic)
              if len(diagnostics)==3: break
          allowed={'fixtureReadable','appLaunched','homepage','maskingHomepage','passwordHomepage','keyHomepage','returnHomepage','passwordFreshVerified','passwordAddressTyped','passwordPortCleared','passwordPortTyped','passwordUsernameTyped','keyFreshVerified','keyAddressTyped','keyPortCleared','keyPortTyped','keyUsernameTyped','ordinaryInputReadable','ordinarySentinelObserved','passwordSecureField','passwordHiddenFocused','passwordHiddenBlurred','maskingScanCompleted',
                   'passwordProbeTapped','passwordFingerprintDialog','fingerprintVerified','passwordConfirmAttempt','passwordConfirmed','passwordCredentialAttempt','passwordCredentialEntered','passwordConnectAttempt','sshConnected','disconnectedAndCleared','passphraseSecureField','encryptedKeyProbeTapped','encryptedKeyFingerprintDialog','encryptedKeyFingerprintVerified','keyConfirmAttempt','keyConfirmed','keyCredentialAttempt','pemPasteButtonTapped','keyCredentialEntered','keyConnectAttempt','encryptedKeyConnected','encryptedKeyDisconnectedAndCleared',
                   'passphraseHiddenAfterFocusChanges','modeSwitchCleared','returnAndReopenCleared'}
          optional={'keyFullscreenRequested','keyMethodSelected','keyPassphraseNativeClicked','keyPassphraseEntered','keyPassphraseFocusConfirmed','keyPassphraseConfirmed','pemControllerConfirmed','pemPasteButtonAttempt','keyConnectHandlerEntered','keyPemParsed','passwordValuePresent','passwordValueUnavailable','passphraseValuePresent','passphraseValueUnavailable','returnButtonUsed','returnEscapeUsed','returnEntryTapped','returnSecureSelected','returnCredentialEntered','returnBackTapped','returnReopenEntryTapped','returnReopenedSecureSelected'}
          progress={key:True for key in allowed | optional if 'hp_xcui_stage='+key.lower() in log}
          try:
              summary=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'macos-secure-private-summary.json')))
          except (OSError,ValueError): summary={}
          structured=[]
          details_available=False
          for name in ('tests','insights','details'):
              try:
                  value=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'macos-secure-private-'+name+'.json')))
                  structured.append(json.dumps(value).lower())
                  if name=='details': details_available=True
              except (OSError,ValueError): pass
          diagnostic_text='\n'.join([log,*structured])
          counts={k:summary[k] for k in ('totalTestCount','passedTests','failedTests','skippedTests') if type(summary.get(k)) is int}
          fixed=['owned loopback fixture unavailable','owned fixture path missing','owned fixture file unreadable','candidate app did not launch','normal homepage ssh entry missing',
                 'named address group or ordinary input missing','ordinary input is not readable',
                 'system accessibility tree is empty','native secure field missing from system tree',
                 'synthetic credential exposed in system accessibility tree','host key probe unavailable',
                 'independently expected host fingerprint missing','fingerprint confirmation unavailable',
                 'connection action unavailable','native ssh session did not authenticate','disconnect action missing',
                 'disconnect did not return to form','password not cleared after disconnect','private key mode missing',
                 'password retained after mode switch','passphrase retained after mode switch','back action missing',
                 'normal homepage did not return','prior credential retained']
          fixed += ['ordinary target fields are not readable']
          fixed += ['secure password input has no protected value','secure passphrase input has no protected value']
          fixed += ['ordinary sentinel not found in system accessibility values']
          fixed += ['ordinary field sentinel not read back','ordinary field target not read back']
          fixed += ['fresh ordinary form defaults unconfirmed','default port was not cleared']
          fixed += ['password target not confirmed','encrypted key target not confirmed']
          fixed += ['fingerprint confirmation is not unique','fingerprint confirmation center not visible','fingerprint dialog did not close','fingerprint confirmation not reflected in form']
          fixed += ['secure credential overlay obstructs fingerprint confirmation']
          fixed += ['normal homepage not confirmed','return input state unavailable']
          fixed += ['private key editor missing','encrypted key session did not authenticate','passphrase not cleared after disconnect']
          fixed += ['form scroll target unavailable','requested control is not hittable','requested control is disabled', 'form action is not unique','form action center not visible and stable','secure credential overlay obstructs form action','requested control unavailable','pasted key and passphrase not confirmed','passphrase input state empty','passphrase focus sentinel mismatch','passphrase controller mismatch','pasted key controller mismatch','passphrase input region unavailable','native passphrase field not visibly clickable']
          failure_lines=sorted({int(n) for n in re.findall(r'runnertests\.swift:(\d{1,5}):(?:\d+:)?\s*error:',diagnostic_text) if 1 <= int(n) <= 10000})[:12]
          fixed_failures=[message for message in fixed if message in diagnostic_text]
          categories=[]
          for name,patterns in {'timeout':('timed out','timeout','exceeded execution time'),
                                'interrupted':('test interrupted','test runner exited','lost connection'),
                                'focus':('neither element nor any descendant has keyboard focus','keyboard focus'),
                                'interaction':('not hittable','failed to synthesize event','unable to interact'),
                                'snapshot':('failed to get matching snapshots','snapshot unavailable')}.items():
              if any(pattern in diagnostic_text for pattern in patterns): categories.append(name)
          ordinary=re.findall(r'hp_xcui_ordinary=nodes:(\d{1,5}),values:(\d{1,5}),sentinel:([01])',log)
          ordinary=[{'nodes':int(n),'nonemptyValues':int(v),'sentinelObserved':s=='1'} for n,v,s in ordinary[:2]]
          back_metrics=re.findall(r'hp_xcui_back=buttons:(\d{1,5}),exact:(\d{1,5}),hittable:(\d{1,5})',log)
          back_metrics=[dict(zip(('buttons','exact','hittable'),map(int,row))) for row in back_metrics[:2]]
          secure_metrics=re.findall(r'hp_xcui_secure=phase:(password|passphrase),secure:(\d{1,5}),text:(\d{1,5}),other:(\d{1,5}),id:(\d{1,5}),label:(\d{1,5}),securelabel:(\d{1,5})',log)
          secure_metrics=[{'phase':row[0],**dict(zip(('secure','text','other','id','label','secureLabel'),map(int,row[1:])))} for row in secure_metrics[:4]]
          hits=re.findall(r'hp_xcui_hit=phase:(control|passwordconfirm|passwordconnect|keyconfirm|keyconnect|returnentry|returnsecure|returnback|returnreopenentry),exists:([01]),enabled:([01]),hittable:([01]),inside:([01])',log)
          hit_metrics=[{'phase':phase,**dict(zip(('exists','enabled','hittable','insideWindow'),[v=='1' for v in bits]))} for phase,*bits in hits[:12]]
          key_input=re.findall(r'hp_xcui_keyinput=visible:([01]),key:([01]),passphrase:([01]),sentinel:([01]),empty:([01]),length:([01]),trimmed:([01])(?=\s|$)',log)
          key_input=[dict(zip(('visible','key','passphrase','sentinel','empty','lengthMatches','trimmedMatches'),(v=='1' for v in row))) for row in key_input[:4]]
          form_metrics=re.findall(r'hp_xcui_form=phase:(paste|connect),count:([0-9]),enabled:([01]),hittable:([01]),inside:([01]),scroll:([01])',log)
          form_metrics=[{'phase':phase,'count':int(count),**dict(zip(('enabled','hittable','insideViewport','scrollView'),(v=='1' for v in bits)))} for phase,count,*bits in form_metrics[:4]]
          pass_fields=re.findall(r'hp_xcui_passfield=native:([0-9]),groups:([0-9])',log)
          pass_fields=[{'nativeRoleCount':int(n),'labelGroupCount':int(g)} for n,g in pass_fields[:2]]
          key_geometry=re.findall(r'hp_xcui_keygeom=windoww:(-?\d{1,5}),windowh:(-?\d{1,5}),vieww:(-?\d{1,5}),viewh:(-?\d{1,5}),labels:([0-9]),beforey:(-?\d{1,5}),aftery:(-?\d{1,5}),labelw:(-?\d{1,5}),labelh:(-?\d{1,5})',log)
          key_geometry=[dict(zip(('windowWidth','windowHeight','viewportWidth','viewportHeight','labelCount','beforeY','afterY','labelWidth','labelHeight'),map(int,row))) for row in key_geometry[:24]]
          native_field=re.findall(r'hp_xcui_nativefield=count:([0-9]),hittable:([01]),visible:([01]),x:(-?\d{1,5}),y:(-?\d{1,5}),w:(-?\d{1,5}),h:(-?\d{1,5})',log)
          native_field=[{'count':int(count),'hittable':hit=='1','visible':visible=='1',**dict(zip(('x','y','width','height'),map(int,coords)))} for count,hit,visible,*coords in native_field[:8]]
          confirmations=re.findall(r'hp_xcui_confirm=phase:(password|key),windowclick:([01]),secureoverlap:(\d{1,5})',log)
          confirmations=[{'phase':phase,'windowClick':window=='1','hittableSecureOverlapCount':int(overlap)} for phase,window,overlap in confirmations[:2]]
          fingerprints=re.findall(r'hp_xcui_fingerprint=phase:(password|encryptedkey),nodes:(\d{1,5}),prefix:(\d{1,5}),exact:(\d{1,5})',log)
          fingerprints=[{'phase':phase,'nodes':int(nodes),'sha256PrefixCount':int(prefix),'expectedExactCount':int(exact)} for phase,nodes,prefix,exact in fingerprints[:2]]
          inputs=re.findall(r'hp_xcui_input=phase:(sentinel|passwordaddress|passwordport|passworduser|keyaddress|keyport|keyuser),(target):(\d{1,5})',log)
          inputs=[{'phase':phase,'kind':kind,'exactCount':int(count)} for phase,kind,count in inputs[:7]]
          input_details=re.findall(r'hp_xcui_inputdetail=phase:(address|port|username|keyport),contains:(\d{1,5}),sentinelleft:(\d{1,5})',log)
          input_details=[{'phase':phase,'targetContainedCount':int(contained),'sentinelRemainingCount':int(remaining)} for phase,contained,remaining in input_details[:4]]
          targets=re.findall(r'hp_xcui_target=phase:(passwordfresh|passwordportcleared|passwordbefore|passwordafter|passwordconfirmed|keyfresh|keyportcleared|keybefore|keyafter|keyconfirmed|inputfailure),bits:([01]{13}|missing)',log)
          target_metrics=[{'phase':phase,**dict(zip(('hostMatches','passwordPortMatches','keyPortMatches','userMatches','valid','busy','foreground','probeFailed','hostEmpty','userEmpty','portDefault22','portEmpty','fingerprintConfirmed'),[c=='1' for c in bits]))} if bits!='missing' else {'phase':phase,'diagnosticMissing':True} for phase,bits in targets[:11]]
          metrics=re.findall(r'hp_xcui_metric=windows:(\d{1,5}),nodes:(\d{1,5}),buttons:(\d{1,5}),exact:(\d{1,5}),label:(\d{1,5})',log)
          metrics=[dict(zip(('windows','nodes','buttons','exact','label'),map(int,row))) for row in metrics[:2]]
          home_metrics=metrics[0] if metrics else {}
          methods=('testSystemMasking','testPasswordSSH','testEncryptedKeySSH','testReturnAndReopen')
          cases={name:{'executed':bool(re.search(r'test case[^\n]*'+name.lower(),log)),
                       'passed':bool(re.search(name.lower()+r'[^\n]{0,100}\bpassed\b',log))} for name in methods}
          failed_methods=[name for name in methods if cases[name]['executed'] and not cases[name]['passed']]
          failure_method=failed_methods[0] if failed_methods else None
          test_executed=all(case['executed'] for case in cases.values())
          test_passed=all(case['passed'] for case in cases.values())
          if test_passed: categories=[]
          completed=all(progress.get(k) is True for k in allowed)
          mask_stages={'fixtureReadable','appLaunched','homepage','maskingHomepage','passwordSecureField',
                       'passwordHiddenFocused','passwordHiddenBlurred','passphraseSecureField',
                       'passphraseHiddenAfterFocusChanges','modeSwitchCleared','maskingScanCompleted'}
          password_proven=progress.get('passwordValuePresent') is True or peer
          passphrase_proven=progress.get('passphraseValuePresent') is True or key_peer
          masking_verified=cases['testSystemMasking']['passed'] and all(progress.get(k) is True for k in mask_stages) and password_proven and passphrase_proven
          exact_counts=counts.get('totalTestCount')==4 and counts.get('passedTests')==4 and counts.get('failedTests')==0 and counts.get('skippedTests')==0
          ok=sys.argv[2]=='0' and peer and key_peer and live_peer and test_passed and completed and masking_verified and exact_counts
          report={'schemaVersion':1,'sourceSHA':sha if re.fullmatch(r'[0-9a-f]{40}',sha) else None,
                  'platform':'macos-xcuitest','status':'passed' if ok else 'failed',
                  'scope':'native UI security fields and owned SSH loopback; synthetic values; no physical IME',
                  'embedderFallbackRequested':'hp_xcui_stage=embedderfallbackrequested' in log,
                  'systemTreeAndSecureFieldsVerified':masking_verified,'testExecuted':test_executed,'testPassed':test_passed,'cases':cases,
                  'peerAuthenticationPtyShellAndClose':peer,'encryptedKeyPeerAuthenticationPtyShellAndClose':key_peer,
                  'peerCloseObservedDuringDisconnectWindows':live_peer,
                  'passwordPeerCloseObservedDuringDisconnectWindow':password_live_peer,
                  'encryptedKeyPeerCloseObservedDuringDisconnectWindow':key_live_peer,
                  'passwordInputProven':password_proven,'passphraseInputProven':passphrase_proven,'buildStarted':('swiftcompile' in log or 'build target' in log),
                  'testStarted':('test suite' in log or 'test case' in log),'testCounts':counts,
                  'failureMethod':failure_method,'failedMethods':failed_methods,'buildDiagnostics':diagnostics,'failureSourceLines':failure_lines,'fixedFailures':fixed_failures,
                  'failureCategories':categories,'xcresultDetailsAvailable':details_available,'homeMetrics':home_metrics,
                  'fallbackHomeMetrics':metrics[1] if len(metrics)>1 else {},
                  'ordinaryMetrics':ordinary,'backMetrics':back_metrics,'secureMetrics':secure_metrics,'hitMetrics':hit_metrics,'keyInputMetrics':key_input,'formMetrics':form_metrics,'passphraseFieldMetrics':pass_fields,'keyGeometry':key_geometry,'nativePassphraseField':native_field,'confirmationMetrics':confirmations,'fingerprintMetrics':fingerprints,'peerConnectionCounts':peer_connections,
                  'inputMetrics':inputs,'inputDetails':input_details,'targetMetrics':target_metrics,
                  'progress':progress,'rawLogsUploaded':False}
          if not ok:
              report['errorCode']='xcui_accessibility_permission_missing' if permission else ('secure_field_not_identified' if 'native secure field missing from system tree' in log else ('xcui_test_or_environment_failed' if sys.argv[2]!='0' else ('xcui_test_not_executed' if not test_executed or not completed else ('xcui_test_count_unverified' if not exact_counts else ('secure_input_unproven' if not masking_verified else 'loopback_peer_evidence_incomplete')))))
          with open(sys.argv[1],'w') as output: json.dump(report,output,indent=2);output.write('\n')
          if not ok: sys.exit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flutter-macos-secure-xcui-${{ github.sha }}
          path: ${{ runner.temp }}/macos-secure-evidence/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && github.ref == 'refs/heads/codex/acceptance/macos-secure-design-parity'
        with:
          name: flutter-macos-clean-debug-before-xcuitest-${{ github.sha }}
          path: ${{ runner.temp }}/macos-clean-output/
          if-no-files-found: error
          retention-days: 14
