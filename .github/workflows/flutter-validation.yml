name: Flutter validation shells
on:
  push:
    branches: ['codex/**']
    paths: ['validation/flutter/**', 'validation/shared/**', '.github/workflows/flutter-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lock-and-test:
    if: startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Flutter in runner only
        run: python3 validation/flutter/tool/ci.py bootstrap --destination "$RUNNER_TEMP/flutter-sdk"
      - name: Prepare isolated fixture app
        run: python3 validation/flutter/tool/ci.py prepare --destination "$RUNNER_TEMP/flutter-probe"
      - name: Resolve once and test gate
        shell: bash
        run: |
          cd "$RUNNER_TEMP/flutter-probe"
          flutter --version
          if test -f pubspec.lock; then flutter pub get --enforce-lockfile; else flutter pub get; fi
          flutter analyze
          flutter test --reporter expanded
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: flutter-resolved-lock-${{ github.sha }}
          path: ${{ runner.temp }}/flutter-probe/pubspec.lock
          if-no-files-found: error
          retention-days: 14
  render-characterization:
    if: startsWith(github.ref, 'refs/heads/codex/')
    needs: lock-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Flutter in runner only
        run: python3 validation/flutter/tool/ci.py bootstrap --destination "$RUNNER_TEMP/flutter-sdk"
      - name: Prepare isolated fixture app
        run: python3 validation/flutter/tool/ci.py prepare --destination "$RUNNER_TEMP/flutter-probe"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flutter-resolved-lock-${{ github.sha }}
          path: ${{ runner.temp }}/flutter-probe
      - name: Characterize candidate combining glyph rendering
        shell: bash
        run: |
          cd "$RUNNER_TEMP/flutter-probe"
          flutter pub get --enforce-lockfile
          flutter test diagnostic/combining_render_test.dart --reporter expanded
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: flutter-render-characterization-${{ github.sha }}
          path: ${{ runner.temp }}/flutter-probe/probe-results
          if-no-files-found: error
          retention-days: 14
  build:
    if: startsWith(github.ref, 'refs/heads/codex/')
    needs: lock-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: android, os: ubuntu-24.04}
          - {platform: linux, os: ubuntu-24.04}
          - {platform: windows, os: windows-2022}
          - {platform: macos, os: macos-14}
          - {platform: ios, os: macos-14}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Linux desktop prerequisites
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17.0.16+8'
      - name: Install pinned Flutter in runner only
        shell: bash
        run: python validation/flutter/tool/ci.py bootstrap --destination "$RUNNER_TEMP/flutter-sdk"
      - name: Prepare isolated fixture app
        shell: bash
        run: python validation/flutter/tool/ci.py prepare --destination "$RUNNER_TEMP/flutter-probe"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flutter-resolved-lock-${{ github.sha }}
          path: ${{ runner.temp }}/flutter-probe
      - name: Build test package
        shell: bash
        env:
          PROBE_PLATFORM: ${{ matrix.platform }}
        run: |
          cd "$RUNNER_TEMP/flutter-probe"
          flutter pub get --enforce-lockfile
          case "$PROBE_PLATFORM" in
            android) flutter build apk --debug ;;
            ios) flutter build ios --debug --no-codesign ;;
            *) flutter build "$PROBE_PLATFORM" --debug ;;
          esac
      - name: Collect package and source-linked manifest
        shell: bash
        run: python validation/flutter/tool/ci.py package --destination "$RUNNER_TEMP/flutter-probe" --platform '${{ matrix.platform }}' --output "$RUNNER_TEMP/flutter-output"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/flutter-output
          if-no-files-found: error
          retention-days: 14
