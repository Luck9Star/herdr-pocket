name: Helper fixture validation
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: helper-fixture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixture:
    if: startsWith(github.ref, 'refs/heads/codex/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check the shipping helper against temporary homes
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/helper-venv"
          "$RUNNER_TEMP/helper-venv/bin/pip" install -r helper/requirements.txt
          PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/helper-venv/bin/python" -m unittest discover -s helper/tests -v
      - name: Run isolated fixture tests
        shell: bash
        run: |
          mkdir -p helper-artifacts
          python3 --version > helper-artifacts/python-version.txt
          python3 -m unittest discover -s validation/helper -v > helper-artifacts/tests.txt 2>&1
          python3 validation/helper/fixture_helper.py --demo > helper-artifacts/default-demo.json
          python3 validation/helper/fixture_helper.py --demo --confirm-fixture 'AUTHORIZE FIXTURE' > helper-artifacts/confirmed-demo.json
          python3 -c "import json,os,platform; print(json.dumps({'sourceSHA':os.environ['GITHUB_SHA'],'scope':'fixture-only','realAuthorization':'not-implemented','os':platform.platform(),'python':platform.python_version()}))" > helper-artifacts/manifest.json
          cp validation/helper/fixture_helper.py validation/helper/README.md helper-artifacts/
          python3 -c "import hashlib,pathlib; p=pathlib.Path('helper-artifacts'); (p/'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\n' for f in sorted(p.iterdir()) if f.is_file()))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: helper-fixture-${{ matrix.os }}-${{ github.sha }}
          path: helper-artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Package the one-time POSIX helper source and verify its entry point
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out="$RUNNER_TEMP/pocket-helper"
          mkdir -p "$out/herdr_pocket_helper"
          cp helper/{README.md,requirements.txt} "$out/"
          cp helper/herdr_pocket_helper/{__init__,__main__,store,wire}.py "$out/herdr_pocket_helper/"
          cd "$out"
          PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/helper-venv/bin/python" -m herdr_pocket_helper --help > /dev/null
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('.')
          (root/'manifest.json').write_text(json.dumps({
              'scope':'one-time POSIX helper, Python source kit',
              'sourceSHA':os.environ['GITHUB_SHA'], 'runId':os.environ['GITHUB_RUN_ID'],
              'verification':'isolated temporary homes; packaged CLI help; no deployment'
          },indent=2)+'\n')
          files = sorted(p for p in root.rglob('*') if p.is_file())
          (root/'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p}\n' for p in files))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os == 'Linux'
        with:
          name: posix-pairing-helper-source-${{ github.sha }}
          path: ${{ runner.temp }}/pocket-helper/
          retention-days: 14
          if-no-files-found: error
