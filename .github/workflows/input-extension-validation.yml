name: Isolated input extension fixture
on:
  workflow_call:
    inputs:
      release_candidate:
        description: Select the independent release-profile evidence lane instead of the dev fixture
        type: boolean
        required: false
        default: false
      cache_seed:
        description: Allow the default-branch ref so the shared zig cache is seeded where every branch can restore it
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  build:
    if: ${{ !inputs.release_candidate && (startsWith(github.ref, 'refs/heads/codex/') || (inputs.cache_seed && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_SHA: 2ecf19a92fc3a7fff75b6ce3655ef04f4625ec01
      PATCH_SHA256: 7f89a79677a456f024bd73555130861cd1b0b47e9d4d69f98d4e18ffc7f1ed8a
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: herdrdev/herdr
          ref: 2ecf19a92fc3a7fff75b6ce3655ef04f4625ec01
          path: fixture-source
          persist-credentials: false
      - name: Verify the source and apply the isolated extension
        run: |
          test "$(git -C fixture-source rev-parse HEAD)" = "$BASE_SHA"
          PATCH="$GITHUB_WORKSPACE/validation/herdr-input-extension/herdr-0.9.5-pocket-input.patch"
          echo "$PATCH_SHA256  $PATCH" | sha256sum -c -
          git -C fixture-source apply --check "$PATCH"
          git -C fixture-source apply "$PATCH"
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Install the pinned Ghostty build compiler in the disposable runner
        env:
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/fixture-zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/fixture-zig" --strip-components=1
          test "$("$RUNNER_TEMP/fixture-zig/zig" version)" = 0.16.0
          echo "ZIG=$RUNNER_TEMP/fixture-zig/zig" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/zig
            fixture-source/target
          key: pocket-input-fixture-${{ env.BASE_SHA }}-${{ env.PATCH_SHA256 }}-rust196-zig0160-zcache
          restore-keys: |
            pocket-input-fixture-${{ env.BASE_SHA }}-${{ env.PATCH_SHA256 }}-rust196-zig0160-
      - name: Prefetch the vendored zig dependencies with retries
        continue-on-error: true
        timeout-minutes: 8
        working-directory: fixture-source/vendor/libghostty-vt
        run: |
          set -euo pipefail
          urls="$(grep -rhoE 'https://[^"[:space:]]+\.(tar\.gz|tar\.zst|tgz)' --include='*.zon' . | sort -u)"
          count="$(printf '%s\n' "$urls" | grep -c .)"
          echo "prefetching $count vendored zig dependencies"
          for round in 1 2 3 4 5 6; do
            failed=0
            while read -r url; do
              [ -z "$url" ] && continue
              if timeout 60 "$ZIG" fetch "$url" >/dev/null 2>&1; then
                echo "ok: $url"
              else
                echo "miss (round $round): $url"
                failed=1
              fi
            done <<< "$urls"
            [ "$failed" -eq 0 ] && { echo "all dependencies prefetched (round $round)"; exit 0; }
            sleep 15
          done
          echo "::warning::zig dependency prefetch incomplete after 6 rounds; the build step retries on its own" >&2
          exit 1
      - name: Check atomic input guard and build the fixture server
        timeout-minutes: 40
        working-directory: fixture-source
        run: |
          set -o pipefail
          for case in pocket_input_guards_identity_rejects_bad_bytes_and_never_resizes observer_input_modes_are_per_client_and_survive_backpressure unreadable_observer_modes_close_only_that_observer_without_false_modes; do
            cargo test --locked --package herdr "$case" -- --nocapture | tee "$RUNNER_TEMP/input-test.log"
            grep -Fq 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/input-test.log"
          done
          # 0.9.5 selects herdr-dev whenever this binary has debug assertions;
          # the loopback harness intentionally exercises the release `herdr` path.
          # Keep dev optimisation/profile and the normal test build; set this on
          # the binary only so test dependencies need not be rebuilt.
          cargo rustc --locked --package herdr --bin herdr -- -C debug-assertions=no
          mkdir "$RUNNER_TEMP/input-fixture"
          cp target/debug/herdr LICENSE "$RUNNER_TEMP/input-fixture/"
          python3 "$GITHUB_WORKSPACE/validation/remote-harness/observer_mode_probe.py" \
            --binary "$RUNNER_TEMP/input-fixture/herdr" --expect candidate \
            --cols 120 --rows 40 | tee "$RUNNER_TEMP/input-fixture/observer-input-modes.json"
          cp "$GITHUB_WORKSPACE/validation/herdr-input-extension/herdr-0.9.5-pocket-input.patch" "$RUNNER_TEMP/input-fixture/"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,signal,socket,subprocess,tempfile,time
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'input-fixture'
          # Verify the built artifact itself in a separate, owned sandbox. Do not
          # send terminal input or expose fixture logs in the artifact.
          with tempfile.TemporaryDirectory(prefix='hp-path-',dir=os.environ['RUNNER_TEMP']) as d:
              tmp=pathlib.Path(d)
              env={k:v for k,v in os.environ.items() if not k.startswith('HERDR_') and k not in ('SSH_AUTH_SOCK','SSH_AGENT_PID','BASH_ENV')}
              env.update(HOME=str(tmp),XDG_CONFIG_HOME=str(tmp/'config'),XDG_STATE_HOME=str(tmp/'state'),XDG_DATA_HOME=str(tmp/'data'),XDG_CACHE_HOME=str(tmp/'cache'),SHELL='/bin/sh')
              proc=subprocess.Popen([str(root/'herdr'),'--session','fixture-smoke','server'],env=env,cwd=tmp,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,start_new_session=True)
              try:
                  sock=tmp/'config/herdr/sessions/fixture-smoke/herdr.sock'
                  def request(method):
                      with socket.socket(socket.AF_UNIX,socket.SOCK_STREAM) as s:
                          s.settimeout(0.5);s.connect(str(sock))
                          s.sendall(json.dumps({'id':'fixture-readiness','method':method,'params':{}}).encode()+b'\n')
                          data=bytearray()
                          while b'\n' not in data and len(data)<=1_048_576:
                              chunk=s.recv(4096)
                              if not chunk: break
                              data.extend(chunk)
                          if len(data)>1_048_576: raise ValueError('oversize response')
                          value=json.loads(data.split(b'\n',1)[0])
                          if not isinstance(value,dict) or value.get('id')!='fixture-readiness' or not isinstance(value.get('result'),dict): raise ValueError('invalid response')
                          return value['result']
                  deadline=time.monotonic()+20
                  while True:
                      if proc.poll() is not None: raise SystemExit('fixture_server_exited')
                      try:
                          result=request('session.snapshot')
                          if result.get('type')!='session_snapshot' or result.get('snapshot',{}).get('version')!='0.9.5' or result.get('snapshot',{}).get('protocol')!=22: raise ValueError('invalid snapshot')
                          capability=request('pocket.input.capabilities')
                          if capability!={'type':'pocket_input_capabilities','version':1,'protocol':22,'atomic_terminal_guard':True,'raw_bytes':True,'max_input_bytes':4096}: raise ValueError('invalid capability')
                          break
                      except (OSError,ValueError,TypeError):
                          if time.monotonic()>=deadline: raise SystemExit('fixture_readiness_or_capability_failed')
                          time.sleep(0.1)
                  if (tmp/'config/herdr-dev').exists(): raise SystemExit('fixture_unexpected_debug_config')
              finally:
                  if proc.poll() is None:
                      try: os.killpg(proc.pid,signal.SIGTERM)
                      except ProcessLookupError: pass
                      try: proc.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          try: os.killpg(proc.pid,signal.SIGKILL)
                          except ProcessLookupError: pass
                          proc.wait(timeout=5)
          data={'scope':'isolated validation fixture','sourceSHA':os.environ['GITHUB_SHA'],'upstreamSHA':os.environ['BASE_SHA'],'patchSHA256':os.environ['PATCH_SHA256'],'binarySHA256':hashlib.sha256((root/'herdr').read_bytes()).hexdigest(),'buildProfile':'dev','binaryDebugAssertions':False,'configDirectory':'herdr','readinessAndCapabilitySmokePassed':True}
          (root/'manifest.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: input-fixture-${{ github.sha }}
          path: ${{ runner.temp }}/input-fixture/
          retention-days: 2
          if-no-files-found: error

  release-profile:
    if: inputs.release_candidate && startsWith(github.ref, 'refs/heads/codex/network-batch/with-emulators-input-host-')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE_SHA: 2ecf19a92fc3a7fff75b6ce3655ef04f4625ec01
      PATCH_SHA256: 7f89a79677a456f024bd73555130861cd1b0b47e9d4d69f98d4e18ffc7f1ed8a
      ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      CARGO_BUILD_JOBS: 2
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: herdrdev/herdr
          ref: 2ecf19a92fc3a7fff75b6ce3655ef04f4625ec01
          path: fixture-source
          persist-credentials: false
      - name: Test candidate tool without host credentials
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PYTHON'
          import io,json,os,pathlib,unittest
          suite=unittest.defaultTestLoader.discover('validation/herdr-input-extension',pattern='test_*.py')
          result=unittest.TextTestRunner(stream=io.StringIO(),verbosity=0).run(suite)
          passed=result.wasSuccessful() and result.testsRun>0 and not result.skipped
          report={'schemaVersion':1,'sourceSHA':os.environ['GITHUB_SHA'],'status':'passed' if passed else 'failed',
                  'testsRun':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),'skipped':len(result.skipped)}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'input-host-tool-tests.json').write_text(json.dumps(report)+'\n')
          print(json.dumps(report));raise SystemExit(0 if passed else 1)
          PYTHON
      - name: Prepare the same pinned compilers in the disposable runner
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          mkdir "$RUNNER_TEMP/input-host-cargo-cache"
          echo "CARGO_HOME=$RUNNER_TEMP/input-host-cargo-cache" >> "$GITHUB_ENV"
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/input-host-zig.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/input-host-zig.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/input-host-zig"
          tar -xJf "$RUNNER_TEMP/input-host-zig.tar.xz" -C "$RUNNER_TEMP/input-host-zig" --strip-components=1
          test "$("$RUNNER_TEMP/input-host-zig/zig" version)" = 0.16.0
          echo "$RUNNER_TEMP/input-host-zig" >> "$GITHUB_PATH"
      - name: Populate a dedicated public dependency cache before offline build
        working-directory: fixture-source
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          echo "$PATCH_SHA256  $GITHUB_WORKSPACE/validation/herdr-input-extension/herdr-0.9.5-pocket-input.patch" | sha256sum -c -
          mkdir -p "$CARGO_HOME"
          for name in config config.toml credentials credentials.toml; do
            test ! -e "$CARGO_HOME/$name" && test ! -L "$CARGO_HOME/$name"
          done
          cargo fetch --locked
      - name: Build the separate offline release-profile candidate
        run: |
          python3 validation/herdr-input-extension/candidate.py build \
            --source "$GITHUB_WORKSPACE/fixture-source" --cargo-cache "$CARGO_HOME" \
            --pocket-source-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/input-host-candidate"
      - name: Preflight only the newly owned named-session target
        run: |
          python3 validation/herdr-input-extension/candidate.py preflight \
            --candidate "$RUNNER_TEMP/input-host-candidate" --output "$RUNNER_TEMP/input-host-preflight"
      - name: Collect typed evidence without binary or dependency uploads
        if: always()
        run: |
          python3 validation/herdr-input-extension/candidate.py evidence \
            --build-dir "$RUNNER_TEMP/input-host-candidate" --preflight-dir "$RUNNER_TEMP/input-host-preflight" \
            --tests "$RUNNER_TEMP/input-host-tool-tests.json" --pocket-source-sha "$GITHUB_SHA" \
            --zig-archive-sha "$ZIG_SHA256" --output "$RUNNER_TEMP/input-host-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: input-host-release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/input-host-evidence/summary.json
          if-no-files-found: ignore
          retention-days: 14
