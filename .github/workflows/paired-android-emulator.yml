name: Android emulator pairing
on:
  workflow_call:
permissions:
  contents: read
jobs:
  android-device-key:
    if: startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: validation/tauri/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - name: Build the x86_64 emulator variant of the Android application
        working-directory: validation/tauri
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add x86_64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          npm ci
          npm run tauri -- icon icon.svg
          npm run tauri -- android init --ci
          python3 scripts/wire-android.py
          npm run tauri -- android build --debug --target x86_64 --apk --ci
      - name: Pair through the real Android WebView and protected signer
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server acl
          python3 -m venv "$RUNNER_TEMP/android-venv"
          "$RUNNER_TEMP/android-venv/bin/pip" install -r validation/pairing/requirements.txt websocket-client==1.8.0
          mapfile -t apks < <(find validation/tauri/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk')
          test "${#apks[@]}" = 1
          bash validation/remote-harness/with-android-emulator.sh "$RUNNER_TEMP/android-venv/bin/python" validation/remote-harness/run-ci.py --paired-gui tauri-android --tauri-app "${apks[0]}" --output "$RUNNER_TEMP/android-gui-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-emulator-pairing-${{ github.sha }}
          path: |
            ${{ runner.temp }}/android-gui-evidence/
            ${{ runner.temp }}/avd-evidence/
          retention-days: 14
          if-no-files-found: warn
