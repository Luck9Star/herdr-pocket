name: Paired GUI to isolated SSH
on:
  workflow_call:
    inputs:
      flutter_only:
        type: boolean
        default: false
      input_fixture:
        type: boolean
        default: false
      s06_split:
        type: boolean
        default: false
      s06_guarded:
        type: boolean
        default: false
      s06_route:
        type: string
        default: flutter
  workflow_dispatch:
    inputs:
      linux_direct_ssh:
        description: Run only the Linux Tauri ordinary SSH password acceptance
        type: choice
        options: ['off', password]
        default: 'off'
      s06_split:
        description: Run two real SSH/herdr targets through the Flutter split UI
        type: boolean
        default: false
      s06_guarded:
        description: Build the reviewed input fixture and verify both S06 input targets
        type: boolean
        default: false
      s06_route:
        description: Desktop candidate for the opt-in S06 acceptance
        type: choice
        options: [flutter, tauri, both]
        default: flutter
permissions:
  contents: read
concurrency:
  group: paired-gui-${{ github.ref }}-${{ inputs.input_fixture }}-${{ inputs.s06_split }}-${{ inputs.s06_guarded }}-${{ inputs.s06_route }}${{ inputs.linux_direct_ssh == 'password' && '-linux-direct-password' || '' }}
  cancel-in-progress: true
jobs:
  s06-input-fixture:
    if: inputs.linux_direct_ssh != 'password' && inputs.s06_split && inputs.s06_guarded
    uses: ./.github/workflows/input-extension-validation.yml
  paired-observe:
    needs: s06-input-fixture
    if: always() && startsWith(github.ref, 'refs/heads/codex/') && (needs.s06-input-fixture.result == 'success' || needs.s06-input-fixture.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        route: ${{ fromJSON(inputs.linux_direct_ssh == 'password' && '["tauri"]' || inputs.s06_split && (inputs.s06_route == 'tauri' && '["tauri"]' || inputs.s06_route == 'both' && '["flutter","tauri"]' || '["flutter"]') || inputs.flutter_only && '["flutter"]' || '["flutter","tauri"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate the optional routes
        env:
          S06_SPLIT: ${{ inputs.s06_split }}
          S06_GUARDED: ${{ inputs.s06_guarded }}
          S06_ROUTE: ${{ inputs.s06_route }}
          LINUX_DIRECT_SSH: ${{ inputs.linux_direct_ssh }}
        run: |
          if [ "$LINUX_DIRECT_SSH" = password ] && { [ "$S06_SPLIT" = true ] || [ "$S06_GUARDED" = true ]; }; then
            echo 'linux_direct_ssh password requires both S06 options to be disabled' >&2
            exit 1
          fi
          if [ "$S06_GUARDED" = true ] && [ "$S06_SPLIT" != true ]; then
            echo 's06_guarded requires s06_split' >&2
            exit 1
          fi
          case "$S06_ROUTE" in flutter|tauri|both|'') ;; *) echo 'invalid s06_route' >&2; exit 1 ;; esac
      - name: Install isolated helper and loopback sshd dependencies
        if: inputs.linux_direct_ssh != 'password'
        run: |
          python3 -m venv "$RUNNER_TEMP/pairing-venv"
          "$RUNNER_TEMP/pairing-venv/bin/pip" install -r validation/pairing/requirements.txt 'paramiko==4.0.0' 'pillow==12.2.0'
          PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/pairing-venv/bin/python" -m unittest discover -s validation/remote-harness -q
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y openssh-server
      - name: Prepare the ordinary SSH peer and check its evidence gates
        if: inputs.linux_direct_ssh == 'password'
        run: |
          python3 -m venv "$RUNNER_TEMP/direct-ssh-venv"
          "$RUNNER_TEMP/direct-ssh-venv/bin/pip" install -r validation/pairing/requirements.txt 'paramiko==4.0.0' 'pillow==12.2.0'
          PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/direct-ssh-venv/bin/python" -m unittest discover \
            -s validation/remote-harness -p test_tauri_linux_direct_ssh.py -v
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
      - name: Prepare the Flutter candidate used by the Android package
        if: matrix.route == 'flutter'
        run: |
          python3 validation/flutter/tool/ci.py bootstrap --destination "$RUNNER_TEMP/flutter-sdk"
          export PATH="$RUNNER_TEMP/flutter-sdk/bin:$PATH"
          python3 validation/flutter/tool/ci.py prepare --destination "$RUNNER_TEMP/flutter-gui"
          python3 validation/flutter/tool/candidate.py apply --destination "$RUNNER_TEMP/flutter-gui"
          cd "$RUNNER_TEMP/flutter-gui"
          flutter pub get
          python3 "$GITHUB_WORKSPACE/validation/flutter/tool/candidate.py" verify-lock --destination "$RUNNER_TEMP/flutter-gui"
      - name: Verify Flutter dashboard when an authenticated peer closes
        if: ${{ matrix.route == 'flutter' && inputs.s06_split && !inputs.s06_guarded && !inputs.input_fixture }}
        working-directory: ${{ runner.temp }}/flutter-gui
        run: |
          HERDR_FIXTURE_PYTHON="$RUNNER_TEMP/pairing-venv/bin/python" \
            "$RUNNER_TEMP/flutter-sdk/bin/flutter" test --no-pub --reporter expanded test/dashboard_peer_eof_test.dart
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.route == 'tauri'
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: validation/tauri/package-lock.json
      - name: Prepare Linux native GUI driver
        if: matrix.route == 'tauri'
        env:
          S06_SPLIT: ${{ inputs.s06_split }}
          LINUX_DIRECT_SSH: ${{ inputs.linux_direct_ssh }}
        run: |
          packages=(libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev build-essential patchelf webkit2gtk-driver xvfb xauth dbus-x11)
          if [ "$S06_SPLIT" = true ]; then packages+=(fonts-noto-cjk fontconfig); fi
          if [ "$LINUX_DIRECT_SSH" = password ]; then
            packages+=(fonts-noto-cjk tesseract-ocr=5.3.4-1build5 tesseract-ocr-eng=1:4.1.0-2)
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y "${packages[@]}"
          if [ "$S06_SPLIT" = true ]; then
            dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk fontconfig > "$RUNNER_TEMP/s06-gtk-fonts.txt"
            fc-match 'sans-serif:lang=zh-cn' >> "$RUNNER_TEMP/s06-gtk-fonts.txt"
            fc-match 'monospace:lang=zh-cn' >> "$RUNNER_TEMP/s06-gtk-fonts.txt"
            cat "$RUNNER_TEMP/s06-gtk-fonts.txt"
          fi
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: matrix.route == 'tauri'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            validation/tauri/src-tauri/target
          key: paired-gui-${{ runner.os }}-rust196-${{ hashFiles('validation/tauri/src-tauri/Cargo.lock') }}
      - name: Build native Tauri executable with production frontend assets
        if: matrix.route == 'tauri'
        working-directory: validation/tauri
        run: |
          cargo install tauri-driver --version 2.1.0 --locked
          npm ci
          npm test
          npm run tauri -- icon icon.svg
          npm run tauri -- build --debug --no-bundle -- --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.linux_direct_ssh != 'password' && (inputs.input_fixture || inputs.s06_guarded)
        with:
          name: input-fixture-${{ github.sha }}
          path: ${{ runner.temp }}/input-fixture
      - name: Review pairing, authorize the displayed key, choose pane and observe updates
        if: inputs.linux_direct_ssh != 'password'
        env:
          GUI_ROUTE: ${{ matrix.route }}
          INPUT_FIXTURE: ${{ inputs.input_fixture || inputs.s06_guarded }}
          S06_SPLIT: ${{ inputs.s06_split }}
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          args=()
          if [ "$INPUT_FIXTURE" = true ]; then args+=(--input-fixture "$RUNNER_TEMP/input-fixture"); fi
          if [ "$S06_SPLIT" = true ]; then args+=(--s06-split); fi
          if [ "$GUI_ROUTE" = flutter ]; then
            "$RUNNER_TEMP/pairing-venv/bin/python" validation/remote-harness/run-ci.py --paired-gui flutter --flutter-app "$RUNNER_TEMP/flutter-gui" --output "$RUNNER_TEMP/paired-evidence" "${args[@]}"
          else
            screen_args=()
            if [ "$S06_SPLIT" = true ]; then screen_args=(-s '-screen 0 1920x1400x24'); fi
            xvfb-run -a "${screen_args[@]}" dbus-run-session -- "$RUNNER_TEMP/pairing-venv/bin/python" validation/remote-harness/run-ci.py --paired-gui tauri --tauri-app "$GITHUB_WORKSPACE/validation/tauri/src-tauri/target/debug/herdr-pocket-tauri-probe" --output "$RUNNER_TEMP/paired-evidence" "${args[@]}"
          fi
      - name: Record the S06 GTK typography environment
        if: always() && matrix.route == 'tauri' && inputs.s06_split
        run: |
          if [ -f "$RUNNER_TEMP/s06-gtk-fonts.txt" ] && [ -d "$RUNNER_TEMP/paired-evidence" ]; then
            cp "$RUNNER_TEMP/s06-gtk-fonts.txt" "$RUNNER_TEMP/paired-evidence/gtk-fonts.txt"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && inputs.linux_direct_ssh != 'password'
        with:
          name: paired-gui-${{ matrix.route }}-${{ inputs.s06_split && 's06-' || '' }}${{ (inputs.input_fixture || inputs.s06_guarded) && 'guarded-input' || 'stock-observe' }}-${{ github.sha }}
          path: ${{ runner.temp }}/paired-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Connect the native Linux app to a disposable ordinary SSH peer
        if: inputs.linux_direct_ssh == 'password'
        env:
          GDK_SCALE: '1'
          GDK_DPI_SCALE: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s '-screen 0 1920x1400x24' dbus-run-session -- \
            "$RUNNER_TEMP/direct-ssh-venv/bin/python" validation/remote-harness/tauri_linux_direct_ssh.py \
            --app "$GITHUB_WORKSPACE/validation/tauri/src-tauri/target/debug/herdr-pocket-tauri-probe" \
            --source-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/linux-direct-ssh-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && inputs.linux_direct_ssh == 'password'
        with:
          name: tauri-linux-direct-ssh-password-${{ github.sha }}
          path: ${{ runner.temp }}/linux-direct-ssh-evidence/
          retention-days: 14
          if-no-files-found: warn
