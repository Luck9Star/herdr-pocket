name: Pairing and device-key validation
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pairing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run offline isolated contract
        shell: bash
        run: |
          mkdir pairing-artifacts
          python3 -m venv "$RUNNER_TEMP/pairing-venv"
          PY="$RUNNER_TEMP/pairing-venv/bin/python"
          "$PY" -m pip install -r validation/pairing/requirements.txt
          "$PY" -m pip freeze > pairing-artifacts/python-packages.txt
          "$PY" -m unittest discover -s validation/pairing -v > pairing-artifacts/contract-tests.txt 2>&1
          "$PY" -m unittest discover -s validation/helper -v > pairing-artifacts/helper-tests.txt 2>&1
          "$PY" validation/pairing/demo.py --demo > pairing-artifacts/default-demo.json
          "$PY" validation/pairing/demo.py --demo --confirm-fixture 'AUTHORIZE FIXTURE' > pairing-artifacts/confirmed-demo.json
          "$PY" -c "import json,os,platform; print(json.dumps({'sourceSHA':os.environ['GITHUB_SHA'],'scope':'fixture-only','realAuthorization':'not-executed','nativeDeviceStorage':'not-executed','os':platform.platform(),'python':platform.python_version()}))" > pairing-artifacts/manifest.json
      - name: Compile Apple backend and run memory-only CryptoKit probe
        if: runner.os == 'macOS'
        shell: bash
        run: |
          swift --version > pairing-artifacts/swift-version.txt
          swiftc -warnings-as-errors validation/pairing/native/apple/DeviceKeys.swift validation/pairing/native/apple/MemoryStoreProbe.swift -o "$RUNNER_TEMP/pairing-memory-probe"
          "$RUNNER_TEMP/pairing-memory-probe" > pairing-artifacts/apple-memory-double.json
          xcodebuild -version > pairing-artifacts/xcode-version.txt
          xcrun --sdk iphonesimulator swiftc -typecheck -target arm64-apple-ios15.0-simulator -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" validation/pairing/native/apple/DeviceKeys.swift
      - name: Hash non-secret validation artifacts
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          p = Path('pairing-artifacts')
          p.mkdir(exist_ok=True)
          sources = [f for f in Path('validation/pairing').rglob('*') if f.is_file() and '__pycache__' not in f.parts and f.suffix != '.pyc']
          sources.append(Path('.github/workflows/pairing-validation.yml'))
          (p / 'source.json').write_text(json.dumps({'sourceSHA': os.environ['GITHUB_SHA'], 'runUrl': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'], 'scope': 'compile and fixture evidence only; no system storage/device/real authorization execution', 'files': {str(f): hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(sources)}}, indent=2) + '\n')
          (p / 'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest() + '  ' + f.name + '\n' for f in sorted(p.iterdir()) if f.is_file() and f.name != 'SHA256SUMS'))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pairing-contract-${{ matrix.os }}-${{ github.sha }}
          path: pairing-artifacts/
          retention-days: 14
          if-no-files-found: error
  android-bridge-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - name: Compile shared signer and run temporary JVM fixtures; no emulator or Keystore calls
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35'
          mkdir -p pairing-artifacts "$RUNNER_TEMP/pairing-classes"
          BC_JAR="$RUNNER_TEMP/bcprov-jdk18on-1.86.jar"
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/bouncycastle/bcprov-jdk18on/1.86/bcprov-jdk18on-1.86.jar -o "$BC_JAR"
          echo "2af190b300cbb0b35e248ccf5f4a06b6072030aeb3da7a98ec73abe5b4cb371f  $BC_JAR" | sha256sum -c -
          javac --release 17 -cp "$ANDROID_HOME/platforms/android-35/android.jar:$BC_JAR" -d "$RUNNER_TEMP/pairing-classes" validation/pairing/native/android/*.java validation/pairing/native/android/tests/*.java
          java -cp "$RUNNER_TEMP/pairing-classes:$BC_JAR" org.herdr.pairing.DeviceKeyStoreCoreTest > pairing-artifacts/android-jvm-fixtures.json
          sha256sum "$BC_JAR" > pairing-artifacts/android-dependency-sha256.txt
          java -version 2> pairing-artifacts/java-version.txt
          echo '{"scope":"Android-API35-compile-and-pure-JVM-temp-fixtures","keystoreRuntime":"not-executed","device":"not-executed"}' > pairing-artifacts/android-compile.json
      - name: Hash non-secret validation artifacts
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          p = Path('pairing-artifacts')
          p.mkdir(exist_ok=True)
          sources = [f for f in Path('validation/pairing').rglob('*') if f.is_file() and '__pycache__' not in f.parts and f.suffix != '.pyc']
          sources.append(Path('.github/workflows/pairing-validation.yml'))
          (p / 'source.json').write_text(json.dumps({'sourceSHA': os.environ['GITHUB_SHA'], 'runUrl': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'], 'scope': 'compile and fixture evidence only; no system storage/device/real authorization execution', 'files': {str(f): hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(sources)}}, indent=2) + '\n')
          (p / 'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest() + '  ' + f.name + '\n' for f in sorted(p.iterdir()) if f.is_file() and f.name != 'SHA256SUMS'))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pairing-android-compile-${{ github.sha }}
          path: pairing-artifacts/
          retention-days: 14
          if-no-files-found: error
