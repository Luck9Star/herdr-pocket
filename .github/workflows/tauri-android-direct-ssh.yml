name: Tauri Android direct SSH device evidence
on:
  push:
    branches: ['codex/acceptance/direct-ssh-android-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tauri-android-direct-ssh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  direct-ssh-api35:
    if: startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: validation/tauri/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - name: Prepare isolated device and SSH dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y acl libpulse0 libgl1 libgl1-mesa-dri libnss3 libxkbcommon-x11-0 libxcb-cursor0
          python3 -m venv "$RUNNER_TEMP/direct-ssh-venv"
          "$RUNNER_TEMP/direct-ssh-venv/bin/pip" install -r validation/pairing/requirements.txt websocket-client==1.8.0 paramiko==4.0.0
          "$RUNNER_TEMP/direct-ssh-venv/bin/python" -m unittest discover -s validation/remote-harness -p 'test_*.py' -v
      - name: Build the current x86_64 Android application
        working-directory: validation/tauri
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add x86_64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          npm ci
          npm test
          npm run tauri -- icon icon.svg
          npm run tauri -- android init --ci
          python3 scripts/wire-android.py
          npm run tauri -- android build --debug --target x86_64 --apk --ci
          python3 - "$RUNNER_TEMP/tauri-direct-x86_64.apk" <<'PY'
          from pathlib import Path
          import sys, zipfile
          candidates=[]
          for path in Path('src-tauri/gen/android/app/build/outputs/apk').rglob('*.apk'):
              try:
                  with zipfile.ZipFile(path) as apk:
                      if any(name.startswith('lib/x86_64/') and name.endswith('.so') for name in apk.namelist()):
                          candidates.append(path)
              except (OSError, zipfile.BadZipFile):
                  pass
          if len(candidates) != 1:
              raise SystemExit('expected exactly one x86_64 test APK')
          Path(sys.argv[1]).write_bytes(candidates[0].read_bytes())
          PY
      - name: Exercise real app UI against an owned temporary SSH server
        run: |
          mkdir -p "$RUNNER_TEMP/tauri-direct-evidence"
          bash validation/remote-harness/with-android-emulator.sh \
            "$RUNNER_TEMP/direct-ssh-venv/bin/python" validation/remote-harness/tauri_android_direct_ssh.py \
            --apk "$RUNNER_TEMP/tauri-direct-x86_64.apk" --output "$RUNNER_TEMP/tauri-direct-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tauri-android-direct-ssh-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tauri-direct-evidence/
            ${{ runner.temp }}/avd-evidence/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: tauri-android-direct-ssh-test-apk-${{ github.sha }}
          path: ${{ runner.temp }}/tauri-direct-x86_64.apk
          if-no-files-found: error
          retention-days: 14
