name: Tauri Android dual overlay controlled device
on:
  push:
    branches: ['codex/acceptance/tauri-android-dual-overlay-*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tauri-dual-overlay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tauri-build:
    if: startsWith(github.ref, 'refs/heads/codex/acceptance/tauri-android-dual-overlay-build-')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NATIVE_SOURCE: 93ca6cd4b9ccdbe8658d5470c8862b26092aa9dc
      HOST_SOURCE: 5404adfb3c86f5174edda38f1d0c63c8d81996c5
      HOST_RUN: '43736430859'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: validation/tauri/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-dual-native-x86_64-93ca6cd4b9ccdbe8658d5470c8862b26092aa9dc
          run-id: 43732345827
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dual-normal-native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-dual-native-QA-ONLY-x86_64-93ca6cd4b9ccdbe8658d5470c8862b26092aa9dc
          run-id: 43732345827
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dual-qa-native
      - name: Verify fixed Android native inputs
        run: |
          python3 -m venv "$RUNNER_TEMP/dual-venv"
          "$RUNNER_TEMP/dual-venv/bin/pip" install -r validation/pairing/requirements.txt websocket-client==1.8.0
          "$RUNNER_TEMP/dual-venv/bin/python" -m unittest discover -s validation/remote-harness -p 'test_tauri_android_dual*.py' -v
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add x86_64-linux-android
          readelf="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          python3 validation/native/tool/android_bundle.py verify "$RUNNER_TEMP/dual-normal-native" --abi x86_64 --commit "$NATIVE_SOURCE" --readelf "$readelf"
          python3 validation/native/tool/android_dual_qa_bundle.py verify --normal "$RUNNER_TEMP/dual-normal-native" --qa "$RUNNER_TEMP/dual-qa-native" --commit "$NATIVE_SOURCE" --readelf "$readelf"
      - name: Build isolated authorization receiver
        run: bash validation/remote-harness/tauri-dual-auth-receiver/build.sh "$RUNNER_TEMP/dual-auth-receiver.apk"
      - name: Build same-source Tauri normal and QA x86_64 APKs
        working-directory: validation/tauri
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export HEELER_ET_LIB_DIR="$RUNNER_TEMP/dual-qa-native"
          export HP_TS_LIB_DIR="$RUNNER_TEMP/dual-qa-native"
          export CC_x86_64_linux_android="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$CC_x86_64_linux_android"
          npm ci
          npm test
          npm run tauri -- icon icon.svg
          npm run tauri -- android init --ci
          python3 scripts/wire-android.py
          mkdir -p src-tauri/gen/android/app/src/main/jniLibs/x86_64
          cp "$HEELER_ET_LIB_DIR/libheeler_easytier.so" "$HP_TS_LIB_DIR/libhp_tailscale.so" src-tauri/gen/android/app/src/main/jniLibs/x86_64/
          npm run tauri -- android build --debug --target x86_64 --features network-easytier,network-tailscale --apk --ci
          python3 - "$RUNNER_TEMP/tauri-dual-qa.apk" <<'PY'
          from pathlib import Path
          import shutil,sys,zipfile
          candidates=[]
          for path in Path('src-tauri/gen/android/app/build/outputs/apk').rglob('*.apk'):
              with zipfile.ZipFile(path) as archive:
                  if 'lib/x86_64/libherdr_pocket_tauri_probe_lib.so' in archive.namelist(): candidates.append(path)
          if len(candidates)!=1: raise SystemExit('expected one owned x86_64 QA APK')
          shutil.copyfile(candidates[0],sys.argv[1])
          PY
          # Same frontend/source and ABI; relink and replace only the native TS
          # library with the independently verified normal provider.
          export HEELER_ET_LIB_DIR="$RUNNER_TEMP/dual-normal-native"
          export HP_TS_LIB_DIR="$RUNNER_TEMP/dual-normal-native"
          cp "$HEELER_ET_LIB_DIR/libheeler_easytier.so" "$HP_TS_LIB_DIR/libhp_tailscale.so" src-tauri/gen/android/app/src/main/jniLibs/x86_64/
          npm run tauri -- android build --debug --target x86_64 --features network-easytier,network-tailscale --apk --ci
          python3 - "$RUNNER_TEMP/tauri-dual-normal.apk" <<'PY'
          from pathlib import Path
          import shutil,sys,zipfile
          candidates=[]
          for path in Path('src-tauri/gen/android/app/build/outputs/apk').rglob('*.apk'):
              with zipfile.ZipFile(path) as archive:
                  if 'lib/x86_64/libherdr_pocket_tauri_probe_lib.so' in archive.namelist(): candidates.append(path)
          if len(candidates)!=1: raise SystemExit('expected one owned x86_64 normal APK')
          shutil.copyfile(candidates[0],sys.argv[1])
          PY
      - name: Independently verify embedded native libraries
        run: |
          python3 validation/remote-harness/tauri_android_dual_apk.py --apk "$RUNNER_TEMP/tauri-dual-qa.apk" --qa "$RUNNER_TEMP/dual-qa-native" \
            --readelf "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          python3 validation/remote-harness/tauri_android_dual_apk.py --apk "$RUNNER_TEMP/tauri-dual-normal.apk" --qa "$RUNNER_TEMP/dual-normal-native" \
            --readelf "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
      - name: Compare normal and QA application assets
        run: |
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          normal=root/'tauri-dual-normal.apk'; qa=root/'tauri-dual-qa.apk'
          sha=lambda data: hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(normal) as a, zipfile.ZipFile(qa) as b:
              names=lambda z: {name for name in z.namelist() if name.startswith('assets/') and not name.endswith('/')}
              keys=names(a)
              if not keys or keys!=names(b) or any(sha(a.read(name))!=sha(b.read(name)) for name in keys):
                  raise SystemExit('normal/QA frontend assets differ')
              if a.read('lib/x86_64/libheeler_easytier.so')!=b.read('lib/x86_64/libheeler_easytier.so'):
                  raise SystemExit('normal/QA EasyTier differs')
              if a.read('lib/x86_64/libhp_tailscale.so')==b.read('lib/x86_64/libhp_tailscale.so'):
                  raise SystemExit('normal/QA TS variants identical')
          report={'sourceSHA':os.environ['GITHUB_SHA'],'nativeSourceSHA':os.environ['NATIVE_SOURCE'],
                  'scope':'same-source x86_64 APKs; static checks only; QA TS test-only',
                  'frontendAssetsEqual':True,'easytierEqual':True,'tailscaleVariantsDiffer':True,
                  'normalApkSha256':sha(normal.read_bytes()),'qaApkSha256':sha(qa.read_bytes()),
                  'androidLoad':'not run','node':'not run'}
          (root/'tauri-dual-build-summary.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tauri-dual-qa-apks-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tauri-dual-qa.apk
            ${{ runner.temp }}/tauri-dual-normal.apk
            ${{ runner.temp }}/tauri-dual-build-summary.json
            ${{ runner.temp }}/dual-auth-receiver.apk
          if-no-files-found: error
          retention-days: 7
  tauri-device:
    if: startsWith(github.ref, 'refs/heads/codex/acceptance/tauri-android-dual-overlay-device-')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HOST_SOURCE: 5404adfb3c86f5174edda38f1d0c63c8d81996c5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5404adfb3c86f5174edda38f1d0c63c8d81996c5
          path: host-source
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tauri-dual-qa-apks-bf39bb44e6df54140984a0abbe93d40f992c1f23
          run-id: 43742966458
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dual-apks
      - name: Download exact controlled host artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14171011473/zip" > "$RUNNER_TEMP/dual-host.zip"
          printf '%s  %s\n' 4bdc54843a9f438896db3717bd002859021fab51cbe60339c35e8a62a5bd6698 "$RUNNER_TEMP/dual-host.zip" | sha256sum -c -
          mkdir "$RUNNER_TEMP/dual-host-fixtures"
          unzip -q "$RUNNER_TEMP/dual-host.zip" -d "$RUNNER_TEMP/dual-host-fixtures"
      - name: Prepare scoped host and device
        run: |
          git diff --quiet bf39bb44e6df54140984a0abbe93d40f992c1f23 HEAD -- validation/tauri validation/transport-rust validation/network-profiles validation/pairing/native/android validation/shared validation/vendor
          printf '%s  %s\n' a25d9f0215724b2dd0babb84fe0b77f55a331e1028eb09e8f695b0d29fcd3ae0 "$RUNNER_TEMP/dual-apks/tauri-dual-qa.apk" 93b37dad7d9f0f7ee0131aee34148734a833d580dc990a044435a0b47ed6dff3 "$RUNNER_TEMP/dual-apks/dual-auth-receiver.apk" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends acl libpulse0 iproute2 openssh-server libssl-dev pkg-config
          python3 -m venv "$RUNNER_TEMP/dual-venv"
          "$RUNNER_TEMP/dual-venv/bin/pip" install -r validation/pairing/requirements.txt websocket-client==1.8.0
          "$RUNNER_TEMP/dual-venv/bin/python" host-source/validation/remote-harness/dual_overlay_shared_bundle.py verify \
            --bundle "$RUNNER_TEMP/dual-host-fixtures" --source-sha "$HOST_SOURCE" --restore-executable
      - name: Exercise actual Tauri UI on owned API35 AVD
        run: |
          AVD_EVIDENCE_DIR="$RUNNER_TEMP/tauri-dual-avd" bash validation/remote-harness/with-android-emulator.sh \
            "$RUNNER_TEMP/dual-venv/bin/python" validation/remote-harness/tauri_android_dual_overlay.py \
              --apk "$RUNNER_TEMP/dual-apks/tauri-dual-qa.apk" --auth-apk "$RUNNER_TEMP/dual-apks/dual-auth-receiver.apk" \
              --bundle "$RUNNER_TEMP/dual-host-fixtures" --output "$RUNNER_TEMP/tauri-dual-result" \
              --host-source-checkout "$GITHUB_WORKSPACE/host-source" --host-source-sha "$HOST_SOURCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tauri-android-dual-overlay-result-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tauri-dual-result/result.json
            ${{ runner.temp }}/tauri-dual-avd/lifecycle.txt
          if-no-files-found: warn
          retention-days: 14
