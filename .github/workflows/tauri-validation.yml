name: Tauri validation shells
on:
  workflow_call:
    inputs:
      include_ios:
        type: boolean
        default: false
      android_only:
        type: boolean
        default: false
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tauri-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: startsWith(github.ref, 'refs/heads/codex/')
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: >-
          ${{ fromJSON(inputs.include_ios &&
          '[{"platform":"android","runner":"ubuntu-24.04"},{"platform":"ios-simulator","runner":"macos-15"},{"platform":"ios-device","runner":"macos-15"}]' || inputs.android_only &&
          '[{"platform":"android","runner":"ubuntu-24.04"}]' ||
          '[{"platform":"android","runner":"ubuntu-24.04"},{"platform":"ios-simulator","runner":"macos-15"},{"platform":"ios-device","runner":"macos-15"},{"platform":"macos","runner":"macos-15"},{"platform":"linux","runner":"ubuntu-24.04"},{"platform":"windows","runner":"windows-2025"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: validation/tauri
    env:
      CI: 'true'
      PROBE_PLATFORM: ${{ matrix.platform }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: validation/tauri/package-lock.json
      - name: Pin Rust
        run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - name: Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Android toolchain
        if: matrix.platform == 'android'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
      - name: iOS toolchain
        if: startsWith(matrix.platform, 'ios')
        run: |
          rustup target add aarch64-apple-ios-sim aarch64-apple-ios
          xcodebuild -version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            validation/tauri/src-tauri/target
          key: tauri-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-rust196-${{ hashFiles('validation/tauri/src-tauri/Cargo.lock') }}
      - name: Install, verify fixtures and unit tests
        run: |
          npm ci
          npm test
          cargo test --locked --manifest-path core/Cargo.toml
          cargo test --locked --manifest-path ../transport-rust/Cargo.toml
          npm run build
          npm run tauri -- icon icon.svg
      - name: Build test shell
        id: build
        run: |
          case "$PROBE_PLATFORM" in
            linux) npm run tauri -- build --bundles deb -- --locked ;;
            windows) npm run tauri -- build --bundles nsis -- --locked ;;
            macos) npm run tauri -- build --bundles app -- --locked ;;
            android)
              npm run tauri -- android init --ci
              python3 scripts/wire-android.py
              npm run tauri -- android build --debug --target aarch64 --apk --ci
              ;;
            ios-simulator)
              npm run tauri -- ios init --ci
              npm run tauri -- ios build --debug --target aarch64-sim --no-sign --archive-only --ci
              ;;
            ios-device)
              # Unsigned real-device archive; sideload targets sign it themselves.
              npm run tauri -- ios init --ci
              npm run tauri -- ios build --debug --target aarch64 --no-sign --archive-only --ci
              ;;
          esac
      - name: Package test artifacts and provenance
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: python3 scripts/package-artifacts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tauri-${{ matrix.platform }}-${{ github.sha }}
          path: validation/tauri/artifacts/
          retention-days: 14
          if-no-files-found: error
