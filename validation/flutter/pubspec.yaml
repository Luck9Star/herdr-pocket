name: herdr_flutter_probe
description: Isolated terminal fixture and explicitly reviewed read-only SSH snapshot probe.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  terminal_view: 0.5.0
  dartssh2: 4.1.0
  pointycastle: 4.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/rust-notices/
    - assets/shared/mobile-tabs-v1.json
    - assets/shared/design-tokens-v2.json
    - assets/shared/fixture.json
    - assets/shared/network-profiles-v1.json
    - assets/shared/config-transfer-v2.json
    - assets/shared/load-chunk.txt
    - assets/shared/SHA256SUMS
    - assets/shared/fonts/LICENSE-JetBrainsMono.txt
    - assets/shared/fonts/LICENSE-Nerd-Fonts.txt
    - assets/shared/fonts/FONT-NOTICES.md
    - assets/shared/fonts/font-sources.json
    - assets/shared/fonts/licenses/
    - assets/shared/fonts/source-notes/
  fonts:
    - family: ProbeNerd
      fonts:
        - asset: assets/shared/fonts/JetBrainsMonoNerdFontMono-Regular.ttf
