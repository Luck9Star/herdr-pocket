// Apply after the Android application/library plugin. Set the absolute shared directory:
// ext.herdrNetworkSecretsDir = file('<repository>/validation/network-profiles/native/android')
// apply from: new File(herdrNetworkSecretsDir, 'network-secrets.gradle')
def sharedNetworkSecrets = project.file(project.ext.herdrNetworkSecretsDir)
// Complete metadata/vault production slice. Never use the shared tree as a
// source root: Kotlin can otherwise see JVM-only tests/android platform stubs.
// AndroidZeroTierNative is a separate, unbound JNI candidate and is deliberately
// excluded. The service reports unavailable until a vetted host binds a store.
def productionManifest = new File(sharedNetworkSecrets, 'android-production-sources.txt')
if (java.nio.file.Files.isSymbolicLink(productionManifest.toPath())) {
    throw new GradleException('Android production source manifest must not be a symbolic link')
}
if (!productionManifest.isFile()) {
    throw new GradleException('herdrNetworkSecretsDir is missing its production source manifest')
}
def productionSources = productionManifest.readLines('UTF-8')
if (productionSources.isEmpty() ||
    productionSources.any { !(it ==~ /[A-Za-z_][A-Za-z0-9_]*\.java/) } ||
    productionSources.toSet().size() != productionSources.size()) {
    throw new GradleException('invalid Android production source manifest')
}
def sourceFiles = productionSources.collect { new File(sharedNetworkSecrets, it) }
if (sourceFiles.any { java.nio.file.Files.isSymbolicLink(it.toPath()) }) {
    throw new GradleException('Android production sources must not be symbolic links')
}
if (sourceFiles.any { !it.isFile() }) {
    throw new GradleException('herdrNetworkSecretsDir is missing a required production source')
}
def isolatedSources = layout.buildDirectory.dir('generated/herdr-network-sources')
def syncHerdrNetworkSources = tasks.register('syncHerdrNetworkSources', Sync) {
    from(sharedNetworkSecrets) { include productionSources }
    into(isolatedSources)
    // A stale nested source left by a previous build must be removed on reuse.
    outputs.upToDateWhen { false }
}
android {
    sourceSets {
        main {
            // AGP requires a concrete directory in this source-set API.
            // The compile tasks below depend explicitly on the Sync producer.
            java.srcDir isolatedSources.get().asFile
        }
    }
}
// The generated directory must exist before either frontend discovers sources.
// This covers Android variants including compileUniversalDebugKotlin/JavaWithJavac.
tasks.configureEach { task ->
    if (task.name == 'preBuild' ||
        (task.name.startsWith('compile') &&
            (task.name.contains('Kotlin') || task.name.endsWith('JavaWithJavac')))) {
        task.dependsOn(syncHerdrNetworkSources)
    }
}
