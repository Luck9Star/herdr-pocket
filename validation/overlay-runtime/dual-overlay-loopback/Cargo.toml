[package]
name = "herdr-dual-overlay-loopback"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace]

[features]
default = []
real = ["herdr-readonly-transport/overlay-linked-easytier", "herdr-readonly-transport/overlay-linked-tailscale"]
fixture = ["herdr-readonly-transport/overlay-native-fixture", "herdr-readonly-transport/overlay-tailscale-fixture"]

[patch.crates-io]
russh = { path = "../../vendor/russh-0.65.0" }

[dependencies]
herdr-overlay-runtime-probe = { path = "..", version = "=0.1.0" }
herdr-readonly-transport = { path = "../../transport-rust", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "time", "io-util"] }
zeroize = "=1.9.1"
