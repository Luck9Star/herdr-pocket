// Apply only after com.android.application/library; callers set an absolute File:
// ext.herdrDeviceKeysDir = file('<repository>/validation/pairing/native/android')
// apply from: new File(herdrDeviceKeysDir, 'device-keys.gradle')
def sharedKeys = project.file(project.ext.herdrDeviceKeysDir)
if (!new File(sharedKeys, 'AndroidDeviceKeyStore.java').isFile()) {
    throw new GradleException('herdrDeviceKeysDir must point to shared native Android sources')
}
android {
    // Inherit the app template's matching Java/Kotlin bytecode targets.
    sourceSets {
        main {
            java.srcDir sharedKeys
            java.exclude 'tests/**'
            assets.srcDir new File(sharedKeys, 'notices')
        }
    }
}
dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
}
apply from: new File(sharedKeys.parentFile, 'camera/android/camera.gradle')
