[package]
name = "herdr-pocket-tauri-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
name = "herdr_pocket_tauri_probe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
tauri-utils = { version = "=2.10.2", features = ["build-2"] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
herdr-probe-core = { path = "../core" }
herdr-readonly-transport = { path = "../../transport-rust" }
tokio = { version = "=1.54.1", features = ["sync"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(target_os = "android")'.dependencies]
base64ct = { version = "=1.8.3", features = ["alloc"] }

[target.'cfg(target_os = "ios")'.dependencies]
base64ct = { version = "=1.8.3", features = ["alloc"] }
