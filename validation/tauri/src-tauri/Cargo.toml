[package]
name = "herdr-pocket-tauri-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[patch.crates-io]
russh = { path = "../../vendor/russh-0.65.0" }

[lib]
name = "herdr_pocket_tauri_probe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
tauri-utils = { version = "=2.10.2", features = ["build-2"] }

[features]
default = []
network-easytier = ["herdr-readonly-transport/overlay-linked-easytier"]
network-tailscale = ["herdr-readonly-transport/overlay-linked-tailscale"]
network-zerotier = ["herdr-readonly-transport/overlay-linked-zerotier", "herdr-readonly-transport/android-zerotier", "herdr-android-network-source/zerotier"]

[dependencies]
tauri = { version = "=2.12.5", features = [] }
herdr-probe-core = { path = "../core" }
herdr-readonly-transport = { path = "../../transport-rust" }
tokio = { version = "=1.54.1", features = ["sync"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zeroize = "=1.9.1"
url = "=2.5.8"

[target.'cfg(target_os = "android")'.dependencies]
herdr-android-network-source = { path = "../../android-network-source" }
base64ct = { version = "=1.8.3", features = ["alloc"] }

[target.'cfg(target_os = "ios")'.dependencies]
base64ct = { version = "=1.8.3", features = ["alloc"] }

[dev-dependencies]
# Host type-checks the actual source adapter; no JVM/context/node is started.
herdr-android-network-source = { path = "../../android-network-source" }

[profile.release]
strip = true
