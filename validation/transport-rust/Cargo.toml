[package]
name = "herdr-readonly-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
russh = { version = "=0.65.0", default-features = false, features = ["ring"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64ct = { version = "=1.8.3", features = ["alloc"] }
zeroize = "=1.9.1"
ring = "=0.17.14"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[[bin]]
name = "remote-probe"
path = "src/bin/remote-probe.rs"
